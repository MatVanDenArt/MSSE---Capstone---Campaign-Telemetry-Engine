{% if actions %}
<div class="fixed top-20 left-[calc(30%+1.5rem)] lg:left-[calc(30%+2rem)] right-6 lg:right-8 z-50 flex flex-col gap-3 pointer-events-none" id="alert-container">
    {% for action in actions %}
    <div class="bg-dark-800/95 backdrop-blur-xl border {% if action.severity == 'high' %}border-rose-500/50 shadow-[0_10px_30px_rgba(244,63,94,0.2)]{% else %}border-amber-500/50 shadow-[0_10px_30px_rgba(245,158,11,0.15)]{% endif %} rounded-lg p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-4 pointer-events-auto transition-all" id="alert-{{ action.id }}">
        <div class="flex items-start sm:items-center gap-4">
            <div class="mt-1 sm:mt-0">
                <i class="fa-solid {{ action.icon }} text-xl"></i>
            </div>
            <div>
                <p class="text-sm font-bold text-slate-100">Proactive Insight Engine</p>
                <p class="text-sm text-slate-300">{{ action.message }}</p>
            </div>
        </div>
        <button hx-post="{{ action.endpoint }}" hx-target="#alert-{{ action.id }}" hx-swap="outerHTML" class="shrink-0 px-4 py-2 bg-dark-700 hover:bg-dark-600 border border-dark-600 rounded text-sm font-bold text-white transition-colors shadow-inner flex items-center justify-center">
            {{ action.button_text }}
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
