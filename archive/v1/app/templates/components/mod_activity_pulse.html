            <!-- Experiment C: Campaign Activity Pulse (2D Heatmap) -->
            <div class="glass-panel rounded-2xl p-8 border border-dark-600">
                <h3 class="text-lg font-bold text-slate-100 mb-6">Module D2: Campaign Activity Pulse</h3>
                <p class="text-sm text-slate-400 mb-8 max-w-2xl">A classic 2D GitHub-style contribution graph visualizing daily engagement density over the campaign lifespan.</p>
                
                <div class="relative w-full bg-dark-900/50 rounded-xl border border-dark-700 p-8 flex flex-col items-start overflow-hidden">
                    
                    <div class="w-full overflow-x-auto pb-4 custom-scrollbar">
                        <div class="flex items-start gap-4 min-w-[900px]">
                            <!-- Y-Axis (Days) -->
                            <div class="flex flex-col justify-between text-xs text-slate-500 pt-[30px] pb-[6px]" style="height: 164px;">
                                <div>Mon</div>
                                <div>Wed</div>
                                <div>Fri</div>
                            </div>
                            
                            <!-- Heatmap Grid with grouped months -->
                            <div id="heatmap-container" class="flex gap-4"></div>
                        </div>
                    </div>

                    <!-- Legend -->
                    <div class="w-full flex justify-end items-center gap-2 text-xs text-slate-400 mt-2 pr-4">
                        <span>Less</span>
                        <div class="flex gap-1">
                            <div class="w-3.5 h-3.5 bg-dark-800 border border-dark-700 rounded-sm"></div>
                            <div class="w-3.5 h-3.5 bg-[#0e4429] rounded-sm"></div>
                            <div class="w-3.5 h-3.5 bg-[#006d32] rounded-sm"></div>
                            <div class="w-3.5 h-3.5 bg-[#26a641] rounded-sm"></div>
                            <div class="w-3.5 h-3.5 bg-[#39d353] rounded-sm"></div>
                        </div>
                        <span>More</span>
                    </div>

                    <script>
                        (async function(){
                            const campaign_id = document.getElementById('current_campaign').value;
                            try {
                            const res = await fetch((window.location.pathname.includes('/v2/') ? '/api/v2' : '/api/v1') + '/dashboard/ui-lab/heatmap?campaign_id=' + campaign_id);
                            const data = await res.json();
                            const heatmapData = data.heatmap || {};
                            const maxInteractions = Math.max(...Object.values(heatmapData).concat([10]));
                            const t4 = maxInteractions * 0.4;
                            const t3 = maxInteractions * 0.15;
                            const t2 = maxInteractions * 0.05;
                            const dates = Object.keys(heatmapData).sort();
                            
                            // Dynamically determine the campaign date boundaries
                            let startD = new Date('2026-01-01');
                            let endD = new Date('2026-12-31');
                            
                            if (dates.length > 0) {
                                startD = new Date(dates[0]);
                                endD = new Date(dates[dates.length-1]);
                            }
                            
                            // If duration is less than 3 months, pad the endD so the graph doesn't look completely empty
                            let monthDiff = (endD.getFullYear() - startD.getFullYear()) * 12 + (endD.getMonth() - startD.getMonth());
                            if (monthDiff < 3) {
                                endD = new Date(startD);
                                endD.setMonth(startD.getMonth() + 3);
                            }
                            // Limit to 12 months max to avoid horizontal overflow
                            if (monthDiff > 12) {
                                startD = new Date(endD);
                                startD.setMonth(endD.getMonth() - 11);
                            }
                            
                            const colors = ['bg-dark-800', 'bg-[#0e4429]', 'bg-[#006d32]', 'bg-[#26a641]', 'bg-[#39d353]'];
                            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                            
                            let html = '';
                            let currD = new Date(startD.getFullYear(), startD.getMonth(), 1);
                            let finalD = new Date(endD.getFullYear(), endD.getMonth(), 1);
                            
                            while(currD <= finalD) {
                                let m = currD.getMonth();
                                let y = currD.getFullYear();
                                
                                html += '<div class="flex flex-col gap-2">';
                                html += `<div class="text-[11px] text-slate-400 font-medium text-left pl-1">${months[m]} ${y !== startD.getFullYear() ? y : ''}</div>`;
                                html += '<div class="flex gap-[3px]">';
                                
                                let days = new Date(y, m + 1, 0).getDate();
                                let startDay = new Date(y, m, 1).getDay();
                                startDay = startDay === 0 ? 6 : startDay - 1; // 0=Mon, 6=Sun
                                
                                let numWeeks = Math.ceil((days + startDay) / 7);
                                let dayCounter = 0;
                                let currentDayOfWeek = startDay;
                                
                                for(let w=0; w<numWeeks; w++) {
                                    html += '<div class="flex flex-col gap-[3px]">';
                                    for(let row=0; row<7; row++) {
                                        let isActualDay = false;
                                        if (w === 0 && row < startDay) {
                                            isActualDay = false;
                                        } else if (dayCounter >= days) {
                                            isActualDay = false;
                                        } else {
                                            isActualDay = true;
                                            dayCounter++;
                                            currentDayOfWeek = (currentDayOfWeek + 1) % 7;
                                        }
                                        
                                        if (isActualDay) {
                                            const monthStr = (m + 1).toString().padStart(2, '0');
                                            const dayStr = dayCounter.toString().padStart(2, '0');
                                            const dateKey = `${y}-${monthStr}-${dayStr}`;
                                            
                                            const interactions = heatmapData[dateKey] || 0;
                                            
                                            

let intensity = 0;
if (interactions > t4) intensity = 4;
else if (interactions > t3) intensity = 3;
else if (interactions > t2) intensity = 2;
else if (interactions > 0) intensity = 1;
                                            
                                            let color = colors[intensity];
                                            let border = intensity === 0 ? 'border border-dark-700/50' : '';
                                            
                                            let tooltip = `${months[m]} ${dayCounter}, ${y}: ${interactions} interactions`;
                                            if (interactions > t4) tooltip += ` \n🔥 Massive Surge! Campaign Burst Peak.`;
                                            else if (interactions > t3) tooltip += ` \n📈 Elevated Activity. Post-burst engagement.`;
                                            
                                            html += `<div title="${tooltip}" class="w-4 h-4 ${color} ${border} rounded-[3px] transition-colors hover:ring-1 hover:ring-slate-300 cursor-pointer"></div>`;
                                        } else {
                                            html += `<div class="w-4 h-4 rounded-[3px]"></div>`;
                                        }
                                    }
                                    html += '</div>';
                                }
                                html += '</div></div>';
                                
                                currD.setMonth(currD.getMonth() + 1);
                            }
                            
                            const container = document.getElementById('heatmap-container');
                            if(container) container.innerHTML = html;
                        })();
                    </script>
                </div>
</div>
