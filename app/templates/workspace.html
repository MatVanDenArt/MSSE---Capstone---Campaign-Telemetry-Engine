<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@3.0.0/dist/chartjs-chart-treemap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 400: '#60a5fa' },
                        dark: { 900: '#0a0a0a', 800: '#171717', 700: '#262626', 600: '#404040' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/v2.css">
    <style>
        body { background-color: #000; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
        .htmx-indicator { display: none; opacity: 0; }
        .htmx-request .htmx-indicator { display: flex; opacity: 1; }
        .htmx-request.htmx-indicator { display: flex; opacity: 1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        [x-cloak] { display: none !important; }
        
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body x-data="{ activeSidebarView: 'action_center', activeTimeframe: 0, activeTab: 'overview', sidebarOpen: window.innerWidth >= 1280 }" @resize.window="if(window.innerWidth >= 1280) sidebarOpen = true" @open-chat.window="activeSidebarView = 'chat'; sidebarOpen = true" @close-chat.window="activeSidebarView = 'action_center'" class="h-screen flex overflow-hidden antialiased bg-black text-slate-200">

    <!-- Global context state -->
    <input type="hidden" id="current_campaign" name="campaign_id" value="{{ campaign_id }}">
    
    <!-- 1. Slim Left Sidebar (Navigation) -->
    <nav class="w-16 bg-black border-r border-dark-800 flex flex-col items-center py-4 shrink-0 z-20">
        <a href="/lobby" class="text-brand-500 hover:text-brand-400 mb-8" title="Back to Campaigns">
            <i class="fa-solid fa-square-poll-vertical text-xl"></i>
        </a>
        
        <div class="flex flex-col gap-4 w-full px-2">
            <button id="tab-overview" @click="activeTab = 'overview'" hx-get="/api/dashboard/overview" hx-include="#current_campaign, [name='timeframe']" hx-target="#main-canvas" class="p-3 text-slate-400 hover:text-white transition hover:bg-dark-800 border border-transparent rounded" :class="activeTab === 'overview' ? 'text-white border-dark-700 bg-dark-900' : ''" title="Executive Overview">
                <i class="fa-solid fa-chart-pie"></i>
            </button>
            <button id="tab-performance" @click="activeTab = 'performance'" hx-get="/api/dashboard/performance" hx-include="#current_campaign, [name='timeframe']" hx-target="#main-canvas" class="p-3 text-slate-400 hover:text-white transition hover:bg-dark-800 border border-transparent rounded" :class="activeTab === 'performance' ? 'text-white border-dark-700 bg-dark-900' : ''" title="Asset Performance">
                <i class="fa-solid fa-layer-group"></i>
            </button>
            <button id="tab-audience" @click="activeTab = 'audience'" hx-get="/api/dashboard/audience" hx-include="#current_campaign, [name='timeframe']" hx-target="#main-canvas" class="p-3 text-slate-400 hover:text-white transition hover:bg-dark-800 border border-transparent rounded" :class="activeTab === 'audience' ? 'text-white border-dark-700 bg-dark-900' : ''" title="Audience & Target Accounts">
                <i class="fa-solid fa-users-viewfinder"></i>
            </button>
        </div>
        
        <div class="mt-auto flex flex-col gap-4 w-full px-2">
            <button hx-get="/api/dashboard/data-model" hx-include="#current_campaign" hx-target="#main-canvas" class="p-3 text-fuchsia-500 hover:text-fuchsia-400 transition hover:bg-dark-800 border border-transparent" title="Data Model">
                <i class="fa-solid fa-network-wired"></i>
            </button>
            <button class="p-3 text-slate-500 hover:text-white transition hover:bg-dark-800 border border-transparent" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </nav>

    <!-- 2. Main Canvas (Middle Column) -->
    <div class="flex-1 flex flex-col min-w-0 bg-black relative transition-all duration-300">
        
        <!-- Context Bar -->
        <header class="h-16 border-b border-dark-800 flex items-center justify-between px-3 md:px-6 shrink-0 bg-black z-10 overflow-hidden">
            <h1 class="text-xs font-semibold text-slate-400 tracking-widest uppercase flex items-center gap-2 md:gap-3 truncate pr-2">
                {% if 'LIVE' in campaign_id %}
                <div class="w-2 h-2 bg-emerald-500 shrink-0"></div>
                {% else %}
                <div class="w-2 h-2 bg-slate-500 shrink-0"></div>
                {% endif %}
                <span class="truncate">{{ campaign_id.replace("CMP_LIVE_", "").replace("CMP_PAST_", "").replace("_", " ") }}</span>
            </h1>
            
            <div class="flex items-center gap-2 md:gap-4 shrink-0">
                <span class="hidden md:inline px-2 py-1 text-[10px] font-bold bg-dark-900 border border-dark-800 text-slate-400 uppercase tracking-wider">Timeframe</span>
                
                <select x-model.number="activeTimeframe" @change="setTimeout(() => document.getElementById('tab-' + activeTab).click(), 10)" class="sm:hidden bg-black border border-dark-700 text-brand-400 text-[10px] uppercase font-bold px-2 py-1.5 rounded focus:outline-none focus:border-brand-500 transition cursor-pointer">
                    <option value="7">7 Days</option>
                    <option value="30">30 Days</option>
                    <option value="90">90 Days</option>
                    <option value="0">All Time</option>
                </select>

                <div class="hidden sm:flex bg-black border border-dark-800 p-1 rounded-md gap-1">
                    <button @click="activeTimeframe = 7; setTimeout(() => document.getElementById('tab-' + activeTab).click(), 10)" :class="activeTimeframe === 7 ? 'bg-brand-500/20 text-brand-300 border border-brand-500/50 shadow-[0_0_10px_rgba(56,189,248,0.2)]' : 'text-slate-500 hover:text-slate-300 hover:bg-dark-800 border border-transparent'" class="text-[10px] uppercase font-bold px-3 py-1.5 transition rounded">7 Days</button>
                    <button @click="activeTimeframe = 30; setTimeout(() => document.getElementById('tab-' + activeTab).click(), 10)" :class="activeTimeframe === 30 ? 'bg-brand-500/20 text-brand-300 border border-brand-500/50 shadow-[0_0_10px_rgba(56,189,248,0.2)]' : 'text-slate-500 hover:text-slate-300 hover:bg-dark-800 border border-transparent'" class="text-[10px] uppercase font-bold px-3 py-1.5 transition rounded">30 Days</button>
                    <button @click="activeTimeframe = 90; setTimeout(() => document.getElementById('tab-' + activeTab).click(), 10)" :class="activeTimeframe === 90 ? 'bg-brand-500/20 text-brand-300 border border-brand-500/50 shadow-[0_0_10px_rgba(56,189,248,0.2)]' : 'text-slate-500 hover:text-slate-300 hover:bg-dark-800 border border-transparent'" class="text-[10px] uppercase font-bold px-3 py-1.5 transition rounded">90 Days</button>
                    <button @click="activeTimeframe = 0; setTimeout(() => document.getElementById('tab-' + activeTab).click(), 10)" :class="activeTimeframe === 0 ? 'bg-brand-500/20 text-brand-300 border border-brand-500/50 shadow-[0_0_10px_rgba(56,189,248,0.2)]' : 'text-slate-500 hover:text-slate-300 hover:bg-dark-800 border border-transparent'" class="text-[10px] uppercase font-bold px-3 py-1.5 transition rounded">All Time</button>
                </div>
                <button @click="sidebarOpen = !sidebarOpen" class="xl:hidden ml-1 md:ml-4 p-1.5 px-2 md:px-3 text-fuchsia-400 bg-fuchsia-500/10 hover:bg-fuchsia-500/20 border border-fuchsia-500/30 rounded transition flex items-center gap-2 text-[10px] font-bold uppercase tracking-wider shrink-0">
                    <i class="fa-solid fa-robot"></i><span class="hidden sm:inline">Copilot</span>
                </button>
            </div>
        </header>

        <main id="main-canvas" class="flex-1 overflow-y-auto custom-scrollbar p-4 lg:p-6" hx-get="/api/dashboard/overview?campaign_id={{ campaign_id }}" hx-trigger="load">
            <div class="flex justify-center items-center h-full"><i class="fa-solid fa-spinner fa-spin text-brand-500 text-3xl"></i></div>
        </main>
    </div>

    <!-- Mobile Overlay -->
    <div x-show="sidebarOpen" x-transition.opacity @click="sidebarOpen = false" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 xl:hidden" x-cloak></div>

    <!-- 3. Dynamic Sidebar (Action Center & Copilot Chat) -->
    <aside :class="[activeSidebarView === 'action_center' ? 'w-[85%] sm:w-[350px] xl:w-[30%] xl:min-w-[320px] xl:max-w-[400px]' : 'w-[95%] sm:w-[450px] xl:w-[40%] xl:min-w-[450px] xl:max-w-[800px]', sidebarOpen ? 'translate-x-0' : 'translate-x-full']" class="fixed inset-y-0 right-0 xl:relative xl:translate-x-0 border-l border-dark-800 flex flex-col bg-dark-900 shrink-0 z-40 transition-transform duration-300 shadow-2xl xl:shadow-none">
        
        <!-- MAIN CONTENT AREA (Flex-1, Relative) -->
        <div class="flex-1 relative overflow-hidden">
            <!-- === ACTION CENTER VIEW === -->
            <div x-show="activeSidebarView === 'action_center'" class="flex flex-col h-full w-full absolute inset-0 bg-dark-900 z-10 transition-opacity duration-300"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0">
                <!-- Header -->
                <div class="h-16 border-b border-dark-800 flex items-center px-4 shrink-0 bg-dark-900">
                    <h2 class="text-sm font-bold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-list-check"></i> Action Center
                    </h2>
                </div>
                
                <!-- Proactive Tasks Container -->
                <div class="flex-1 overflow-y-auto custom-scrollbar">
                    <div id="copilot-tasks-container"></div>
                </div>
            </div>

            <!-- === COPILOT CHAT VIEW === -->
            <div x-cloak x-show="activeSidebarView === 'chat'" class="flex flex-col h-full w-full absolute inset-0 bg-dark-900 z-20 transition-opacity duration-300"
                 x-transition:enter="transition ease-out duration-300 delay-100"
                 x-transition:enter-start="opacity-0 translate-x-4"
                 x-transition:enter-end="opacity-100 translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 translate-x-0"
                 x-transition:leave-end="opacity-0 translate-x-4">
                <!-- Header -->
                <div class="h-16 border-b border-dark-800 flex items-center justify-between px-4 shrink-0 bg-dark-900">
                    <div class="flex items-center gap-3">
                        <button @click="activeSidebarView = 'action_center'" class="text-slate-500 hover:text-white transition w-6 h-6 flex items-center justify-center rounded bg-dark-800 hover:bg-dark-700">
                            <i class="fa-solid fa-chevron-left text-[10px]"></i>
                        </button>
                        <h2 class="text-xs font-bold text-fuchsia-500 uppercase tracking-widest flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Copilot Chat
                        </h2>
                    </div>
                </div>
                
                <!-- Chat Feed -->
                <div id="chat-history" class="flex-1 p-4 overflow-y-auto text-sm space-y-6 custom-scrollbar pb-32">
                    
                </div>
                
                <!-- Prominent Loading Indicator Overlay -->
                <div id="loading-indicator" class="htmx-indicator absolute bottom-8 left-4 right-4 z-50 transition-opacity duration-300">
                    <div class="flex gap-3 w-full bg-black/90 backdrop-blur-md p-4 rounded-xl border border-fuchsia-900 shadow-[0_0_30px_rgba(217,70,239,0.15)] overflow-hidden relative">
                        <div class="absolute top-0 left-0 w-full h-0.5 bg-fuchsia-500 shadow-[0_0_10px_#d946ef] animate-[scan_2s_ease-in-out_infinite]"></div>
                        <div class="w-8 h-8 bg-fuchsia-600/20 border border-fuchsia-500/50 rounded flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-robot text-xs text-fuchsia-400 animate-pulse"></i>
                        </div>
                        <div class="flex flex-col justify-center w-full min-w-0">
                            <div class="text-fuchsia-400 text-xs font-bold uppercase tracking-widest flex items-center gap-2 mb-1">
                                <i class="fa-solid fa-circle-notch fa-spin"></i> Copilot is Analyzing
                            </div>
                            <div class="text-[10px] text-slate-400 font-mono truncate">Executing autonomous telemetry tools (10-20s)...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- === PERSISTENT INPUT AREA === -->
        <div class="w-full bg-dark-900 shrink-0 z-30 flex flex-col justify-end">
            <!-- Action Chips Wrapper (Hides in chat view to save space) -->
            <div x-show="activeSidebarView === 'action_center'" x-collapse>
                <div id="copilot-action-chips" class="px-4 pb-2 pt-2 flex gap-2 overflow-x-auto custom-scrollbar no-scrollbar whitespace-nowrap">
                    <button @click="activeSidebarView = 'chat'" hx-post="/api/chat" hx-target="#chat-history" hx-swap="beforeend" hx-indicator="#loading-indicator" hx-vals='{"message": "Generate Campaign Report", "reset_context": "true"}' class="text-[10px] uppercase font-bold text-fuchsia-400 bg-black border border-dark-700 hover:border-fuchsia-500 px-3 py-1.5 transition rounded-lg">Gen Report</button>
                    <button @click="activeSidebarView = 'chat'" hx-post="/api/chat" hx-target="#chat-history" hx-swap="beforeend" hx-indicator="#loading-indicator" hx-vals='{"message": "Analyze Funnel Metrics", "reset_context": "true"}' class="text-[10px] uppercase font-bold text-fuchsia-400 bg-black border border-dark-700 hover:border-fuchsia-500 px-3 py-1.5 transition rounded-lg">Analyze Funnel</button>
                    <button @click="activeSidebarView = 'chat'" hx-post="/api/chat" hx-target="#chat-history" hx-swap="beforeend" hx-indicator="#loading-indicator" hx-vals='{"message": "Check Asset Fatigue", "reset_context": "true"}' class="text-[10px] uppercase font-bold text-fuchsia-400 bg-black border border-dark-700 hover:border-fuchsia-500 px-3 py-1.5 transition rounded-lg">Check Fatigue</button>
                </div>
            </div>
            

            
            <div class="p-4 border-t border-dark-800 bg-black">
                <form @submit="activeSidebarView = 'chat'; setTimeout(() => $el.reset(), 10)" hx-post="/api/chat" hx-target="#chat-history" hx-swap="beforeend" hx-indicator="#loading-indicator" class="flex w-full relative group">
                    <input type="hidden" name="timeframe" :value="activeTimeframe">
                    <div class="absolute left-3 top-3 text-fuchsia-500 font-mono text-sm">></div>
                    <input type="text" name="message" class="w-full bg-black border border-dark-700 text-fuchsia-400 text-sm focus:border-fuchsia-500 focus:outline-none placeholder-dark-600 py-3 pl-8 pr-12 transition-colors font-mono" placeholder="query telemetry..." required autocomplete="off">
                    <button type="submit" class="absolute right-2 top-2 w-8 h-8 flex items-center justify-center bg-fuchsia-600 hover:bg-fuchsia-500 text-black transition-colors">
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <script>
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.target.id === 'chat-history') {
                const form = evt.detail.elt;
                if (form.tagName === 'FORM') form.reset();
                const chatHistory = document.getElementById('chat-history');
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        });
    </script>
    <!-- Dev Telemetry Badge -->
    <div class="fixed bottom-4 left-4 bg-dark-900/80 backdrop-blur border border-dark-700 rounded-lg p-2 flex flex-col gap-1 z-50 shadow-xl pointer-events-none"
         x-data="{ stats: {total_calls: 0, cache_hits: 0}, pollInterval: null }"
         x-init="
            const fetchStats = async () => {
                try {
                    const res = await fetch('/api/telemetry/ai-calls');
                    stats = await res.json();
                } catch(e) {}
            };
            fetchStats();
            pollInterval = setInterval(fetchStats, 2000);
         ">
        <div class="text-[9px] uppercase tracking-widest font-bold text-slate-500 mb-1 border-b border-dark-800 pb-1 flex items-center justify-between">
            <span>AI Telemetry</span>
            <i class="fa-solid fa-satellite-dish text-brand-500/50 animate-pulse ml-2"></i>
        </div>
        <div class="flex items-center justify-between gap-4">
            <span class="text-[10px] text-slate-400">API Calls:</span>
            <span class="text-xs font-mono font-bold text-rose-400" x-text="stats.total_calls"></span>
        </div>
        <div class="flex items-center justify-between gap-4">
            <span class="text-[10px] text-slate-400">Cache Hits:</span>
            <span class="text-xs font-mono font-bold text-emerald-400" x-text="stats.cache_hits"></span>
        </div>
    </div>
</body>
</html>
