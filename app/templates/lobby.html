<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 400: '#60a5fa' },
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-dark-800 via-dark-900 to-dark-900 flex flex-col items-center justify-center p-8">

    <div class="max-w-6xl w-full">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-12 gap-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-100 mb-2 flex items-center gap-3">
                    <i class="fa-solid fa-satellite-dish text-brand-500"></i> Wood Group Telemetry
                </h1>
                <p class="text-slate-400">Select a campaign to enter the workspace.</p>
            </div>
            
            <!-- Filters -->
            <div class="flex items-center gap-2 bg-dark-800 p-1 rounded-lg border border-dark-700 self-start md:self-auto">
                <button onclick="filterCampaigns('all')" class="px-4 py-1.5 text-sm font-medium rounded bg-brand-600 text-white transition-colors" id="btn-all">All</button>
                <button onclick="filterCampaigns('active')" class="px-4 py-1.5 text-sm font-medium rounded text-slate-400 hover:text-white transition-colors" id="btn-active"><div class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-2"></div>Active</button>
                <button onclick="filterCampaigns('past')" class="px-4 py-1.5 text-sm font-medium rounded text-slate-400 hover:text-white transition-colors" id="btn-past"><div class="inline-block w-2 h-2 rounded-full bg-slate-500 mr-2"></div>Completed</button>
            </div>
        </div>

        <!-- Campaign Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="campaign-grid">
            {% for campaign in campaigns %}
            <div class="glass-panel p-6 rounded-xl cursor-pointer hover:bg-dark-800 transition-all hover:-translate-y-1 hover:shadow-2xl border border-transparent hover:border-brand-500/30 group campaign-card"
                 data-status="{% if campaign.is_active %}active{% else %}past{% endif %}"
                 onclick="window.location.href='/api/dashboard/workspace?campaign_id={{ campaign.campaign_id }}'">
                
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        {% if campaign.is_active %}
                            <div class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)] animate-pulse"></div>
                            <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Active</span>
                        {% else %}
                            <div class="w-3 h-3 rounded-full bg-slate-500"></div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Completed</span>
                        {% endif %}
                    </div>
                    <i class="fa-solid fa-arrow-right text-slate-600 group-hover:text-brand-400 group-hover:-rotate-45 transition-all"></i>
                </div>
                
                <h2 class="text-xl font-bold text-slate-100 mb-6">{{ campaign.name }}</h2>
                
                <div class="pt-4 border-t border-dark-700/50">
                    <p class="text-xs text-slate-500 uppercase font-semibold mb-1">Pipeline Generated</p>
                    <p class="text-2xl font-bold text-brand-400">${{ "{:,.0f}".format(campaign.total_pipeline) }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function filterCampaigns(status) {
            // Update buttons
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById('btn-' + status);
            activeBtn.classList.add('bg-brand-600', 'text-white');
            activeBtn.classList.remove('text-slate-400');

            // Filter cards
            document.querySelectorAll('.campaign-card').forEach(card => {
                if (status === 'all' || card.dataset.status === status) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
