<!-- OOB Swap for Proactive Tasks Container -->
<div id="copilot-tasks-container" hx-swap-oob="true">
    {% if copilot_tasks %}
    <div class="bg-black border-b border-dark-800 flex flex-col" x-data="{
             tasks: {{ copilot_tasks | tojson | forceescape }},
             visibleTasks: [],
             queue: [],
             totalTasks: {{ copilot_tasks | length }},
             reviewingTaskId: null,
             init() {
                 this.visibleTasks = this.tasks.slice(0, 5);
                 this.queue = this.tasks.slice(5);
                 
                 window.addEventListener('task-resolved', (e) => {
                     if (e.detail && e.detail.id) {
                         this.removeTask(e.detail.id, 'handoff');
                         htmx.ajax('DELETE', '/api/dashboard/trigger/' + e.detail.id, {source: '#chat-history', target: '#chat-history', swap: 'none'});
                         if (this.reviewingTaskId === e.detail.id) {
                             this.reviewingTaskId = null;
                         }
                     }
                 });
             },
             getGlowClass(task) {
                 if (this.reviewingTaskId === task.id) {
                     return 'border-fuchsia-500/50 bg-white/5 opacity-80 cursor-default';
                 }
                 const title = task.title || '';
                 if (task.type === 'ai') {
                     return 'border-fuchsia-900/60 bg-white/5 hover:border-fuchsia-500/50 hover:bg-white/10 cursor-pointer';
                 } else if (title.includes('Fatigue') || title.includes('Threat') || title.includes('Bounce') || task.type === 'alert') {
                     return 'border-rose-900/60 bg-white/5 hover:border-rose-500/50 hover:bg-white/10 cursor-pointer';
                 } else if (title.includes('Spike') || title.includes('Surge') || title.includes('Efficiency') || title.includes('Expansion') || task.type === 'opportunity') {
                     return 'border-emerald-900/60 bg-white/5 hover:border-emerald-500/50 hover:bg-white/10 cursor-pointer';
                 }
                 return 'border-amber-900/60 bg-white/5 hover:border-amber-500/50 hover:bg-white/10 cursor-pointer';
             },
             getCategoryBadge(task) {
                 const title = task.title || '';
                 if (task.type === 'ai' || title.includes('AI Recommendation')) {
                     return { label: 'AI RECOMMENDED', color: 'text-fuchsia-400 bg-fuchsia-950 border-fuchsia-900' };
                 } else if (title.includes('Optimize') || title.includes('Fatigue') || title.includes('Threat') || title.includes('Bounce') || task.type === 'alert') {
                     return { label: 'ACTION REQUIRED', color: 'text-rose-400 bg-rose-950 border-rose-900' };
                 } else if (title.includes('Scale') || title.includes('Spike') || title.includes('Surge') || title.includes('Efficiency') || title.includes('Expansion') || task.type === 'opportunity') {
                     return { label: 'GROWTH OPPTY', color: 'text-emerald-400 bg-emerald-950 border-emerald-900' };
                 }
                 return { label: 'INSIGHT', color: 'text-amber-400 bg-amber-950 border-amber-900' };
             },
             removeTask(id, type) {
                const el = document.getElementById('task-card-' + id);
                if (el) {
                    el.style.transitionProperty = 'all';
                    el.style.transitionDuration = '600ms';
                    el.style.transitionTimingFunction = 'cubic-bezier(0.4, 0, 0.2, 1)';
                    if (type === 'handoff') {
                        el.classList.add('translate-x-full', 'scale-90', 'opacity-0', 'border-fuchsia-500', 'shadow-[0_0_20px_rgba(217,70,239,0.5)]');
                    } else {
                        el.classList.add('-translate-x-full', 'opacity-0', 'scale-95');
                    }
                    
                    setTimeout(() => {
                        el.style.transitionDuration = '400ms';
                        el.style.height = el.offsetHeight + 'px';
                        el.style.overflow = 'hidden';
                        void el.offsetHeight; // force reflow
                        el.style.height = '0px';
                        el.style.paddingTop = '0px';
                        el.style.paddingBottom = '0px';
                        el.style.marginTop = '0px';
                        el.style.marginBottom = '0px';
                        el.style.borderWidth = '0px';
                        el.style.opacity = '0';
                    }, 400);
                }
                setTimeout(() => {
                    this.visibleTasks = this.visibleTasks.filter(t => t.id !== id);
                    setTimeout(() => {
                        if (this.queue.length > 0) {
                            this.visibleTasks.push(this.queue.shift());
                        }
                    }, 50);
                }, 800);
            },
             executeTask(task) {
                 this.reviewingTaskId = task.id;
                 this.$dispatch('open-chat');
                 
                 htmx.ajax('POST', '/api/chat', {
                     target: '#chat-history',
                     swap: 'beforeend',
                     indicator: '#loading-indicator',
                     values: {
                         message: 'Review Priority Action: ' + task.title + '. Details: ' + (task.subtitle || task.message) + '. Suggested Action: ' + task.action_command,
                         time_context: 'Strict Context: Target event occurred around ' + task.created_at,
                         trigger_id: task.id,
                         intent: 'review',
                         reset_context: 'true'
                     }
                 });
             },
             dismissTask(task) {
                 this.removeTask(task.id, 'dismiss');
                 htmx.ajax('DELETE', '/api/dashboard/trigger/' + task.id, {source: '#chat-history', target: '#chat-history', swap: 'none'});
             }
         }">

        <div class="px-4 py-3 flex justify-between items-center bg-dark-900 border-b border-dark-800">
            <span class="text-sm font-bold text-fuchsia-500">Priority Actions</span>
            <span class="text-xs text-slate-500 font-mono flex items-center gap-2">
                <span x-show="queue.length > 0" class="animate-pulse text-fuchsia-400">
                    <i class="fa-solid fa-layer-group"></i> <span x-text="queue.length"></span> Queued
                </span>
                <span>[<span x-text="totalTasks"></span>]</span>
            </span>
        </div>

        <div class="flex flex-col p-2 space-y-2 overflow-y-auto custom-scrollbar relative">
            <template x-for="(task, index) in visibleTasks" :key="task.id">
                <div @click="if(reviewingTaskId !== task.id) executeTask(task)"
                    class="group p-4 text-left transition-all duration-300 ease-in-out flex flex-col w-full relative border rounded-lg backdrop-blur-sm transform"
                    :class="getGlowClass(task)" :id="'task-card-' + task.id"
                    x-transition:enter="transition ease-out duration-500 transform"
                    x-transition:enter-start="opacity-0 translate-y-8 scale-95"
                    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                    x-transition:leave="transition ease-in duration-300 transform"
                    x-transition:leave-start="opacity-100 translate-x-0"
                    x-transition:leave-end="opacity-0 -translate-x-full">

                    <!-- Header Row -->
                    <div class="flex items-start justify-between w-full mb-2">
                        <div class="flex flex-col gap-1 w-5/6">
                            <span
                                class="text-[8px] font-bold px-1.5 py-0.5 rounded border uppercase tracking-widest w-fit"
                                :class="getCategoryBadge(task).color" x-text="getCategoryBadge(task).label"></span>
                            <div class="flex items-center gap-2 mt-1">
                                <div class="text-xs font-bold text-slate-200 tracking-wide truncate"
                                    x-text="task.title"></div>
                            </div>
                        </div>
                        <!-- Dismiss Button -->
                        <button @click.stop.prevent="dismissTask(task)"
                            class="text-slate-500 hover:text-rose-400 p-1 transition-colors z-10 shrink-0"
                            title="Dismiss">
                            <i class="fa-solid fa-times"></i>
                        </button>
                    </div>

                    <!-- Context Row -->
                    <div class="mb-2 pr-2">
                        <div class="text-xs text-slate-400 line-clamp-2 leading-relaxed"
                            x-text="task.subtitle || task.message"></div>
                    </div>

                    <!-- Action Row -->
                    <div class="flex justify-end mt-1">
                        <button @click.prevent="executeTask(task)"
                            class="flex items-center gap-1.5 text-xs font-mono font-bold transition-all duration-300"
                            :class="reviewingTaskId === task.id ? 'text-fuchsia-600 cursor-default' : 'text-fuchsia-500/80 group-hover:text-fuchsia-300'">
                            <span class="transition-colors"
                                x-text="reviewingTaskId === task.id ? 'Reviewing...' : (task.action_payload || 'Send to Copilot')"></span>
                            <i class="fa-solid transition-transform duration-300"
                                :class="reviewingTaskId === task.id ? 'fa-spinner fa-spin' : 'fa-arrow-right group-hover:translate-x-1'"></i>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
    {% endif %}
</div>
