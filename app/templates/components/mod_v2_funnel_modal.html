<div id="funnel-modal" class="fixed inset-0 z-[100]" x-data="{ 
        open: true,
        companyFilter: '',
        seniorityFilter: '',
        users: {{ data | tojson | forceescape }},
        
        get filteredUsers() {
            return this.users.filter(u => {
                const matchCompany = this.companyFilter === '' || u.company_name === this.companyFilter;
                const matchSeniority = this.seniorityFilter === '' || u.seniority === this.seniorityFilter;
                return matchCompany && matchSeniority;
            });
        },
        
        get availableCompanies() {
            const allComps = Array.from(new Set(this.users.map(u => u.company_name))).sort();
            return allComps.map(comp => {
                const count = this.users.filter(u => u.company_name === comp && (this.seniorityFilter === '' || u.seniority === this.seniorityFilter)).length;
                return { name: comp, count: count };
            });
        },

        get availableSeniorities() {
            const hierarchy = {
                'C-Level': 1,
                'VP': 2,
                'Director': 3,
                'Manager': 4,
                'Individual Contributor': 5
            };
            
            const allSens = Array.from(new Set(this.users.map(u => u.seniority))).sort((a, b) => {
                const rankA = hierarchy[a] || 99;
                const rankB = hierarchy[b] || 99;
                return rankA - rankB;
            });
            
            return allSens.map(sen => {
                const count = this.users.filter(u => u.seniority === sen && (this.companyFilter === '' || u.company_name === this.companyFilter)).length;
                return { name: sen, count: count };
            });
        },
        
        formatMoney(val) {
            if (!val) return '';
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
        }
    }" x-show="open" @keydown.escape.window="open = false" style="display: none;">
    
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" @click="open = false" x-show="open" x-transition.opacity></div>

    <!-- Slide-over panel -->
    <div class="fixed inset-y-0 right-0 w-[30%] min-w-[350px] max-w-[450px] bg-dark-900 border-l border-dark-800 shadow-2xl flex flex-col transform transition-transform"
         x-show="open"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full">
         
        <!-- Header -->
        <div class="p-6 border-b border-dark-800 flex justify-between items-start bg-black">
            <div>
                <h3 class="text-sm font-bold text-white tracking-widest uppercase mb-1">
                    <i class="fa-solid fa-users mr-2 text-cyan-400"></i> Funnel Drilldown
                </h3>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest">{{ stage }} Stage</p>
            </div>
            <button @click="open = false" class="text-slate-500 hover:text-white transition-colors bg-white/5 hover:bg-white/10 w-8 h-8 rounded flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Filters -->
        <div class="p-4 border-b border-dark-800 bg-black/50 grid grid-cols-2 gap-3 shrink-0">
            <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Company</label>
                <select x-model="companyFilter" class="w-full bg-dark-900 border border-dark-700 rounded p-1.5 text-xs text-slate-300 focus:border-cyan-500 focus:ring-0">
                    <option value="">All companies</option>
                    <template x-for="comp in availableCompanies" :key="comp.name">
                        <option :value="comp.name" x-text="comp.name + ' (' + comp.count + ')'"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Seniority</label>
                <select x-model="seniorityFilter" class="w-full bg-dark-900 border border-dark-700 rounded p-1.5 text-xs text-slate-300 focus:border-cyan-500 focus:ring-0">
                    <option value="">All roles</option>
                    <template x-for="sen in availableSeniorities" :key="sen.name">
                        <option :value="sen.name" x-text="(sen.name || 'Unknown') + ' (' + sen.count + ')'"></option>
                    </template>
                </select>
            </div>
        </div>
        
        <!-- Body -->
        <div class="p-4 overflow-y-auto custom-scrollbar flex-1 bg-black space-y-2">
            <template x-for="row in filteredUsers" :key="row.company_name + row.first_name + row.last_name">
                <div class="bg-dark-900/40 border border-dark-800 p-4 rounded flex justify-between items-center hover:bg-dark-800/60 transition-colors">
                    <div>
                        <h4 class="font-bold text-slate-200 text-sm" x-text="row.company_name"></h4>
                        <p class="text-[11px] text-slate-500 mt-1"><span class="text-slate-300" x-text="row.first_name + ' ' + row.last_name"></span> &bull; <span x-text="row.job_title"></span></p>
                    </div>
                    <div class="text-right" x-show="row.value">
                        <div class="text-sm font-black text-white tracking-tight" x-text="formatMoney(row.value)"></div>
                    </div>
                </div>
            </template>
            
            <div x-show="filteredUsers.length === 0" class="text-center p-10 text-slate-500 text-xs">
                No accounts match your filters.
            </div>
        </div>
    </div>
</div>
