<div id="funnel-modal" class="fixed inset-0 z-[100]" x-data="{ 
        open: true,
        companyFilter: '',
        seniorityFilter: ''
    }" x-show="open" @keydown.escape.window="open = false" style="display: none;">
    
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" @click="open = false" x-show="open" x-transition.opacity></div>

    <!-- Slide-over panel -->
    <div class="fixed inset-y-0 right-0 w-[30%] min-w-[350px] max-w-[450px] bg-dark-900 border-l border-dark-800 shadow-2xl flex flex-col transform transition-transform"
         x-show="open"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full">
         
        <!-- Header -->
        <div class="p-6 border-b border-dark-800 flex justify-between items-start bg-black">
            <div>
                <h3 class="text-sm font-bold text-white tracking-widest uppercase mb-1">
                    <i class="fa-solid fa-users mr-2 text-cyan-400"></i> Funnel Drilldown
                </h3>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest">{{ stage }} Stage</p>
            </div>
            <button @click="open = false" class="text-slate-500 hover:text-white transition-colors bg-white/5 hover:bg-white/10 w-8 h-8 rounded flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Filters -->
        <div class="p-4 border-b border-dark-800 bg-black/50 grid grid-cols-2 gap-3 shrink-0">
            <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Company</label>
                <select x-model="companyFilter" class="w-full bg-dark-900 border border-dark-700 rounded p-1.5 text-xs text-slate-300 focus:border-cyan-500 focus:ring-0">
                    <option value="">All Companies</option>
                    {% set comps = [] %}
                    {% for r in data %}
                        {% if r.company_name not in comps %}
                            <option value="{{ r.company_name }}">{{ r.company_name }}</option>
                            {% set _ = comps.append(r.company_name) %}
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Seniority</label>
                <select x-model="seniorityFilter" class="w-full bg-dark-900 border border-dark-700 rounded p-1.5 text-xs text-slate-300 focus:border-cyan-500 focus:ring-0">
                    <option value="">All Roles</option>
                    <option value="Director">Director</option>
                    <option value="VP">VP</option>
                    <option value="C-Level">C-Level</option>
                    <option value="Manager">Manager</option>
                    <option value="Individual Contributor">IC</option>
                </select>
            </div>
        </div>
        
        <!-- Body -->
        <div class="p-4 overflow-y-auto custom-scrollbar flex-1 bg-black space-y-2">
            {% if data %}
                {% for row in data %}
                    <div class="bg-dark-900/40 border border-dark-800 p-4 rounded flex justify-between items-center hover:bg-dark-800/60 transition-colors"
                         x-show="(companyFilter === '' || companyFilter === '{{ row.company_name }}') && (seniorityFilter === '' || seniorityFilter === '{{ row.seniority }}')">
                        <div>
                            <h4 class="font-bold text-slate-200 text-sm">{{ row.company_name }}</h4>
                            <p class="text-[10px] text-slate-500 mt-1"><span class="text-slate-300">{{ row.first_name }} {{ row.last_name }}</span> &bull; {{ row.job_title }}</p>
                        </div>
                        {% if row.value %}
                            <div class="text-right">
                                <div class="text-sm font-black text-emerald-400 tracking-tight">${{ "{:,.0f}".format(row.value) }}</div>
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}
            {% else %}
                <div class="text-center p-10 text-slate-500 text-xs">
                    No accounts found in this stage.
                </div>
            {% endif %}
        </div>
    </div>
</div>
