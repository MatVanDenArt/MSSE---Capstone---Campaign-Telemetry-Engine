<div class="w-full">
    <input type="hidden" hidden id="current_campaign" name="campaign_id" value="{{ campaign_id }}">
    
    <div class="bg-black border border-dark-800 p-6 md:p-8">
        
        <!-- TEMP OPTION 2: SMALL MULTIPLES REMOVED -->
        
        <div class="w-full relative flex flex-col" x-data="{
                chartData: {{ chart_data | tojson | forceescape }},
                matrixData: {{ matrix | tojson | forceescape }},
                activePixelX: null,
                
                initChart() {
                    const ctxTimeline = this.$refs.timelineCanvas.getContext('2d');
                    
                    const webDrops = [];
                    const emailDrops = [];
                    const socialDrops = [];
                    
                    this.chartData.labels.forEach(label => {
                        const drops = this.matrixData.filter(m => m.date.startsWith(label));
                        if (drops.length > 0) {
                            const web = drops.filter(d => {
                                if (d.type !== 'Web') return false;
                                // Only show generated campaign assets in the burst graph (exclude core/standard pages)
                                return ['/insight', '/case-stud', '/report', '/webinar', '/article', '/whitepaper', '-b'].some(p => d.asset_name.includes(p));
                            });
                            if (web.length > 0) webDrops.push({x: label, y: 3, names: web.map(d=>d.asset_name).join(', ')});
                            
                            const email = drops.filter(d => d.type === 'Email');
                            if (email.length > 0) emailDrops.push({x: label, y: 1, names: email.map(d=>d.asset_name).join(', ')});
                            
                            const social = drops.filter(d => d.type === 'LinkedIn');
                            if (social.length > 0) socialDrops.push({x: label, y: 2, names: social.map(d=>d.asset_name).join(', ')});
                        }
                    });

                    // COMMON X-AXIS CONFIGURATION TO ENSURE PERFECT ALIGNMENT
                    const commonXAxis = {
                        min: this.chartData.start_date,
                        max: this.chartData.end_date,
                        offset: true,
                        grid: { color: 'rgba(51, 65, 85, 0.3)' },
                        ticks: { 
                            color: '#94a3b8',
                            maxRotation: 0,
                            maxTicksLimit: window.innerWidth < 768 ? 6 : 15,
                            callback: function(value, index, values) {
                                const label = this.getLabelForValue(value);
                                if (label && label.length === 10) {
                                    const d = new Date(label);
                                    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
                                }
                                if (label && label.length === 7) {
                                    const d = new Date(label + '-01');
                                    return d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' });
                                }
                                return label;
                            }
                        }
                    };

                    // TOP CHART: Small Multiples
                    const tooltipTitleCallback = function(tooltipItems) {
                        if (!tooltipItems.length) return '';
                        let label = tooltipItems[0].label;
                        if (label && label.length === 10) {
                            const d = new Date(label);
                            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
                        }
                        return label;
                    };

                    const handleHover = (e, activeElements, chart) => {
                        const xAxis = chart.scales.x;
                        const value = xAxis.getValueForPixel(e.x);
                        if (value !== undefined && value >= 0 && value < chart.data.labels.length) {
                            this.activePixelX = xAxis.getPixelForValue(value);
                        } else {
                            this.activePixelX = null;
                        }
                    };

                    const buildConfig = (data, color, type='line', isLast=false, fill=false, dashed=false) => ({
                        type: type,
                        data: {
                            labels: this.chartData.labels,
                            datasets: [{
                                data: data,
                                borderColor: color,
                                backgroundColor: fill ? color.replace('1)', '0.15)') : color,
                                borderWidth: 2,
                                tension: 0.4,
                                fill: fill,
                                pointRadius: 0,
                                pointHoverRadius: 6,
                                borderDash: dashed ? [5, 5] : [],
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            onHover: handleHover,
                            layout: { padding: { left: 0, right: 0, top: 15, bottom: isLast ? 0 : -10 } },
                            interaction: { mode: 'index', intersect: false },
                            plugins: { 
                                legend: { display: false }, 
                                tooltip: { 
                                    backgroundColor: 'rgba(0,0,0,1)', titleColor: '#f8fafc', bodyColor: '#cbd5e1', borderColor: 'rgba(51,65,85,1)', borderWidth: 1,
                                    callbacks: { title: tooltipTitleCallback }
                                } 
                            },
                            scales: {
                                x: { ...commonXAxis, display: true, ticks: { ...commonXAxis.ticks, display: isLast } },
                                y: { 
                                    display: true, position: 'left', 
                                    ticks: { display: false }, 
                                    grid: { color: 'rgba(51, 65, 85, 0.1)', drawBorder: false }, 
                                    afterFit: (scale) => scale.width = 10 
                                }
                            }
                        }
                    });

                    this.wChart = new Chart(this.$refs.wCanvas, buildConfig(this.chartData.traffic, 'rgba(6, 182, 212, 1)', 'line', false, true, false));
                    this.eChart = new Chart(this.$refs.eCanvas, buildConfig(this.chartData.email, 'rgba(139, 92, 246, 1)', 'line', false, true, false));
                    this.sChart = new Chart(this.$refs.sCanvas, buildConfig(this.chartData.ads, 'rgba(59, 130, 246, 1)', 'line', false, true, false));
                    this.oChart = new Chart(this.$refs.oCanvas, buildConfig(this.chartData.opps, 'rgba(16, 185, 129, 1)', 'line', false, true, false));

                    // BOTTOM CHART: Categorical Dot Plot Track
                    new Chart(ctxTimeline, {
                        type: 'line',
                        data: {
                            labels: this.chartData.labels,
                            datasets: [
                                {
                                    label: 'Web Releases', data: webDrops, type: 'scatter',
                                    pointBackgroundColor: '#06b6d4', pointBorderColor: '#06b6d4',
                                    pointRadius: 6, pointHoverRadius: 10, pointStyle: 'circle'
                                },
                                {
                                    label: 'Social Ads', data: socialDrops, type: 'scatter',
                                    pointBackgroundColor: '#3b82f6', pointBorderColor: '#3b82f6',
                                    pointRadius: 6, pointHoverRadius: 10, pointStyle: 'circle'
                                },
                                {
                                    label: 'Email Drops', data: emailDrops, type: 'scatter',
                                    pointBackgroundColor: '#8b5cf6', pointBorderColor: '#8b5cf6',
                                    pointRadius: 6, pointHoverRadius: 10, pointStyle: 'circle'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            onHover: handleHover,
                            layout: { padding: { left: 0, right: 0, top: 10, bottom: 5 } },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 1)',
                                    titleColor: '#f8fafc', bodyColor: '#cbd5e1',
                                    borderColor: 'rgba(51, 65, 85, 1)', borderWidth: 1,
                                    callbacks: {
                                        title: tooltipTitleCallback,
                                        label: function(context) {
                                            return context.dataset.label + ': ' + context.raw.names;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: { ...commonXAxis, display: true },
                                y: {
                                    type: 'linear', display: true, position: 'left',
                                    min: 0.5, max: 3.5,
                                    grid: { color: 'rgba(51, 65, 85, 0.1)', drawBorder: false },
                                    ticks: { display: false },
                                    afterFit: function(scale) { scale.width = 10; }
                                }
                            }
                        }
                    });
                }
            }" x-init="initChart()">
            
            <!-- Crosshair Line -->
            <div x-show="activePixelX !== null"
                 class="absolute top-0 bottom-0 pointer-events-none border-l-2 border-dashed border-fuchsia-500 opacity-70 z-50 transition-all duration-75"
                 :style="`left: ${activePixelX}px;`" x-cloak>
            </div>
            
            <!-- Top Canvases: Small Multiples -->
            <div class="flex flex-col gap-0 w-full relative pt-2">
                <div class="h-[120px] w-full relative"><canvas x-ref="wCanvas"></canvas><span class="absolute top-2 left-4 text-[10px] text-cyan-400 bg-black/80 px-2 py-0.5 rounded font-bold uppercase tracking-widest pointer-events-none">Web Traffic (Visits)</span></div>
                <div class="h-[90px] w-full relative"><canvas x-ref="eCanvas"></canvas><span class="absolute top-2 left-4 text-[10px] text-purple-400 bg-black/80 px-2 py-0.5 rounded font-bold uppercase tracking-widest pointer-events-none">Email Opens</span></div>
                <div class="h-[90px] w-full relative"><canvas x-ref="sCanvas"></canvas><span class="absolute top-2 left-4 text-[10px] text-blue-400 bg-black/80 px-2 py-0.5 rounded font-bold uppercase tracking-widest pointer-events-none">Social Ads (Clicks)</span></div>
                <div class="h-[120px] w-full relative"><canvas x-ref="oCanvas"></canvas><span class="absolute top-2 left-4 text-[10px] text-emerald-400 bg-black/80 px-2 py-0.5 rounded font-bold uppercase tracking-widest pointer-events-none">CRM Opps Created</span></div>
            </div>
            
            <!-- Bottom Canvas: Timeline Track -->
            <div class="w-full h-[150px] mt-4 pt-4 border-t border-dark-700/50 relative">
                <div class="absolute top-2 left-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest pointer-events-none">Release Cadence</div>
                <canvas x-ref="timelineCanvas"></canvas>
            </div>
        </div>
        
        <!-- Omnichannel Asset Impact Matrix -->
        <div class="mt-8 border-t border-dark-800 pt-8">
            <div x-data="{ 
                currentTab: 'Web',
                sortBy: 'impact', // 'impact', 'views', 'individuals', 'recency'
                matrixDataRaw: {{ matrix | tojson | forceescape }},
                get sortedMatrix() {
                    let arr = this.matrixDataRaw.filter(m => m.type === this.currentTab);
                    if (this.sortBy === 'impact') {
                        arr.sort((a, b) => b.impact_score - a.impact_score);
                    } else if (this.sortBy === 'views') {
                        arr.sort((a, b) => b.engagement - a.engagement);
                    } else if (this.sortBy === 'individuals') {
                        arr.sort((a, b) => b.individuals_engaged - a.individuals_engaged);
                    } else if (this.sortBy === 'recency') {
                        arr.sort((a, b) => new Date(b.date) - new Date(a.date));
                    }
                    return arr;
                },
                getCleanName(raw) {
                    let s = raw;
                    if (s.startsWith('/')) s = s.substring(1);
                    return s.replace(/\//g, ' ').replace(/-/g, ' ').trim().replace(/\b\w/g, l => l.toUpperCase());
                },
                getCategoryColor(type) {
                    if (type === 'Web') return 'rgba(6, 182, 212, 1)';
                    if (type === 'Email') return 'rgba(139, 92, 246, 1)';
                    if (type === 'LinkedIn') return 'rgba(59, 130, 246, 1)';
                    return 'rgba(16, 185, 129, 1)';
                },
                getLineColor(health) {
                    return ['Fatigued', 'Action Required'].includes(health) ? '#f43f5e' : ['Warning', 'At Risk'].includes(health) ? '#f59e0b' : '#10b981';
                },
                formatNumber(num) {
                    return num ? num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '0';
                }
            }">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 border-b border-dark-800 pb-2 gap-4">
                    <div class="flex flex-col md:flex-row items-start md:items-center gap-6">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 md:mb-0 mr-4">Omnichannel Asset Impact Matrix</h4>
                        
                        <!-- Tabs -->
                        <div class="flex gap-6">
                            <button @click="currentTab = 'Web'" :class="currentTab === 'Web' ? 'border-brand-500 text-slate-100' : 'border-transparent text-slate-500 hover:text-slate-300'" class="border-b-2 pb-1 text-[10px] font-bold uppercase tracking-widest transition-colors">Web Pages</button>
                            <button @click="currentTab = 'LinkedIn'" :class="currentTab === 'LinkedIn' ? 'border-brand-500 text-slate-100' : 'border-transparent text-slate-500 hover:text-slate-300'" class="border-b-2 pb-1 text-[10px] font-bold uppercase tracking-widest transition-colors">Social Ads</button>
                            <button @click="currentTab = 'Email'" :class="currentTab === 'Email' ? 'border-brand-500 text-slate-100' : 'border-transparent text-slate-500 hover:text-slate-300'" class="border-b-2 pb-1 text-[10px] font-bold uppercase tracking-widest transition-colors">Email</button>
                        </div>
                    </div>
                    
                    <!-- Sort Dropdown -->
                    <div class="flex items-center gap-3 mb-2 md:mb-0 lg:mb-0">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Sort by:</span>
                        <select x-model="sortBy" class="bg-dark-900 border border-dark-700 text-xs font-bold text-slate-300 rounded px-2 py-1.5 focus:outline-none focus:border-brand-500 cursor-pointer">
                            <option value="impact">Impact score</option>
                            <option value="views">Viewership</option>
                            <option value="individuals">Individuals engaged</option>
                            <option value="recency">Recency</option>
                        </select>
                    </div>
                </div>

                <!-- Asset Rows -->
                <div class="space-y-3">
                    <template x-for="(m, index) in sortedMatrix" :key="m.asset_name">
                        <div class="relative bg-dark-900 border border-dark-800 hover:border-emerald-500/50 hover:-translate-y-1 hover:shadow-xl hover:shadow-emerald-500/10 transition-all duration-300 py-3 px-5 group flex items-center justify-between cursor-pointer rounded" 
                             @click="$dispatch('open-asset-modal', { asset_name: m.asset_name, type: m.type, timeframe: typeof activeTimeframe !== 'undefined' ? activeTimeframe : 0 })"
                             x-data="{
                                sparkline: m.sparkline || [],
                                sparklineDates: m.sparkline_dates || [],
                                chartInstance: null,
                                initSparkline() {
                                    this.$nextTick(() => { this.renderChart(); });
                                    
                                    // Re-render when array re-orders or filters
                                    this.$watch('m.sparkline', () => {
                                        this.sparkline = m.sparkline;
                                        this.sparklineDates = m.sparkline_dates || [];
                                        this.$nextTick(() => { this.renderChart(); });
                                    });
                                },
                                renderChart() {
                                    if (!this.$refs.canvas || this.sparkline.length === 0) return;
                                    if (this.chartInstance) { this.chartInstance.destroy(); }
                                    const ctx = this.$refs.canvas.getContext('2d');
                                    
                                    let chartLabels = this.sparklineDates && this.sparklineDates.length > 0 
                                        ? this.sparklineDates 
                                        : Array.from({length: this.sparkline.length}, (_, i) => i + 1);
                                        
                                    const getOrCreateTooltip = () => {
                                        let tooltipEl = document.getElementById('chartjs-tooltip-global');
                                        if (!tooltipEl) {
                                            tooltipEl = document.createElement('div');
                                            tooltipEl.id = 'chartjs-tooltip-global';
                                            tooltipEl.className = 'pointer-events-none fixed z-[9999] bg-black border border-dark-700 text-slate-200 px-3 py-1.5 rounded-lg shadow-2xl text-xs font-mono whitespace-nowrap transition-opacity duration-75 transform -translate-x-1/2 -translate-y-full mt-[-10px]';
                                            document.body.appendChild(tooltipEl);
                                        }
                                        return tooltipEl;
                                    };
                                    
                                    this.chartInstance = new Chart(ctx, {
                                        type: 'line',
                                        data: {
                                            labels: chartLabels,
                                        datasets: [{
                                                data: this.sparkline,
                                                borderColor: this.getCategoryColor(m.type),
                                                backgroundColor: this.getCategoryColor(m.type).replace('1)', '0.15)'),
                                                borderWidth: 2,
                                                tension: 0.4,
                                                fill: true,
                                                pointRadius: 0,
                                                pointHoverRadius: 4,
                                                pointHoverBackgroundColor: this.getCategoryColor(m.type)
                                            }]
                                        },
                                        options: {
                                            responsive: true,
                                            maintainAspectRatio: false,
                                            animation: false,
                                            interaction: {
                                                mode: 'index',
                                                intersect: false,
                                            },
                                            plugins: { 
                                                legend: { display: false }, 
                                                tooltip: { 
                                                    enabled: false,
                                                    external: function(context) {
                                                        const {chart, tooltip} = context;
                                                        const tooltipEl = getOrCreateTooltip();
                                                        
                                                        if (tooltip.opacity === 0) {
                                                            tooltipEl.style.opacity = 0;
                                                            return;
                                                        }
                                                        
                                                        if (tooltip.body) {
                                                            let title = tooltip.title || [''];
                                                            title = Array.isArray(title) ? title[0] : title;
                                                            if (title && title.includes('-')) {
                                                                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                                                                const p = title.split('-');
                                                                if (p.length === 3) title = parseInt(p[2], 10) + ' ' + months[parseInt(p[1], 10) - 1];
                                                            }
                                                            const body = tooltip.body[0].lines[0];
                                                            const val = body.split(':').pop().trim();
                                                            tooltipEl.innerHTML = `<div class='text-[9px] text-slate-500 font-sans tracking-widest uppercase mb-0.5'>${title}</div><div class='font-bold text-slate-200 text-sm'>${val} <span class='text-[10px] text-slate-400 font-sans font-normal ml-1'>Views</span></div>`;
                                                        }
                                                        
                                                        const canvasRect = chart.canvas.getBoundingClientRect();
                                                        tooltipEl.style.opacity = 1;
                                                        tooltipEl.style.left = canvasRect.left + tooltip.caretX + 'px';
                                                        tooltipEl.style.top = canvasRect.top + tooltip.caretY + 'px';
                                                    }
                                                } 
                                            },
                                            scales: {
                                                x: { display: false },
                                                y: { display: false, suggestedMin: 0 }
                                            },
                                            layout: { padding: { top: 15, bottom: 5, left: 10, right: 10 } }
                                        }
                                    });
                                }
                             }" x-init="initSparkline()">
                            
                            <!-- Left: Asset Info -->
                            <div class="flex flex-col w-[30%] pr-4 shrink-0 overflow-hidden">
                                <div class="flex items-center gap-3">
                                    <div class="flex-1 min-w-0 grid">
                                        <h5 class="col-start-1 row-start-1 text-xs font-bold text-slate-200 truncate transition-opacity duration-300 group-hover:opacity-0" :title="getCleanName(m.asset_name)" x-text="getCleanName(m.asset_name)"></h5>
                                        <h5 class="col-start-1 row-start-1 text-xs font-bold font-mono text-brand-400 truncate transition-opacity duration-300 opacity-0 group-hover:opacity-100" :title="m.asset_name" x-text="m.asset_name"></h5>
                                    </div>
                                    <template x-if="['Fatigued', 'Action Required'].includes(m.health)">
                                        <span class="px-2 py-0.5 rounded text-[9px] uppercase font-bold bg-rose-500/10 text-rose-400 border border-rose-500/30 flex items-center shrink-0">
                                            <span class="w-1 h-1 rounded-full bg-rose-400 mr-1.5 animate-pulse"></span>Fatigued
                                        </span>
                                    </template>
                                </div>
                                <span class="text-slate-500 font-mono text-[9px] uppercase tracking-widest mt-1">
                                    <i class="fa-regular fa-calendar mr-1"></i><span x-text="m.formatted_date"></span>
                                </span>
                            </div>

                            <!-- Middle: Dedicated Sparkline -->
                            <div class="flex-1 h-[55px] opacity-90 px-2 min-w-0 hidden md:block">
                                <canvas x-ref="canvas"></canvas>
                            </div>

                            <!-- Right: Metrics & Hover Action -->
                            <div class="flex items-center justify-end relative w-auto shrink-0 pl-2">
                                <div class="flex items-center gap-4 bg-dark-950 px-4 py-1.5 border border-dark-800 rounded group-hover:border-dark-600 transition-colors duration-300 shadow-sm">
                                    <div class="text-center">
                                        <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-0.5" x-text="m.type === 'Web' ? 'Views' : m.type === 'LinkedIn' ? 'Clicks' : 'Opens'"></div>
                                        <div class="text-base font-bold text-slate-200 font-mono" x-text="formatNumber(m.engagement)"></div>
                                    </div>
                                    <div class="w-px h-6 bg-dark-800"></div>
                                    <div class="text-center">
                                        <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-0.5">Individuals</div>
                                        <div class="text-base font-bold text-slate-200 font-mono" x-text="formatNumber(m.individuals_engaged)"></div>
                                    </div>
                                    <div class="w-px h-6 bg-dark-800"></div>
                                    <div class="text-center hidden sm:block">
                                        <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-0.5">Accounts</div>
                                        <div class="text-base font-bold text-slate-200 font-mono" x-text="formatNumber(m.accounts_activated)"></div>
                                    </div>
                                    <div class="w-px h-6 bg-dark-800 hidden sm:block"></div>
                                    <div class="text-center">
                                        <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-0.5">Impact</div>
                                        <div class="text-base font-bold font-mono" :style="`color: ${getLineColor(m.health)}`" x-text="m.impact_score"></div>
                                    </div>
                                </div>
                                
                            </div>
                        </div>
                    </template>
                    
                    <template x-if="sortedMatrix.length === 0">
                        <div class="p-12 text-center border border-dashed border-dark-600 rounded-xl bg-dark-800/30">
                            <i class="fa-solid fa-ghost text-4xl text-dark-600 mb-3"></i>
                            <p class="text-slate-400 text-sm font-medium">No assets discovered in this category.</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        </div>
        
    </div>
</div>
