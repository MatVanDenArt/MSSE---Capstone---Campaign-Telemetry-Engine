<div class="bg-black border border-dark-800 p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-sm font-bold text-white tracking-widest uppercase"><i class="fa-solid fa-filter mr-2 text-cyan-400"></i> Audience Velocity Funnel</h3>
            <p class="text-[10px] text-slate-400 mt-1">Conversion velocity across buying journey stages</p>
        </div>
        <button class="w-8 h-8 rounded bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i class="fa-solid fa-expand text-slate-400 text-xs"></i>
        </button>
    </div>

    <!-- Funnel Visualization (Horizontal) -->
    <div class="flex-grow flex flex-col justify-center gap-4 px-2" x-data="{
        stages: [],
        init() {
            fetch(`/api/v2/dashboard/ui-lab/funnel?campaign_id=${document.getElementById('current_campaign').value}`)
                .then(res => res.json())
                .then(data => {
                    this.stages = [
                        { name: 'Anonymous Traffic', count: data.visitors, rate: '100%', color: 'border-slate-500', bg: 'bg-slate-500/10', text: 'text-slate-400', width: 'w-full' },
                        { name: 'Engaged Traffic', count: data.engaged, rate: ((data.engaged/data.visitors)*100).toFixed(1)+'%', color: 'border-cyan-500', bg: 'bg-cyan-500/10', text: 'text-cyan-400', width: 'w-[85%]' },
                        { name: 'Known Accounts', count: data.known, rate: ((data.known/data.engaged)*100).toFixed(1)+'%', color: 'border-brand-500', bg: 'bg-brand-500/10', text: 'text-brand-400', width: 'w-[65%]' },
                        { name: 'SQL (Opportunity)', count: data.pipeline, rate: ((data.pipeline/data.known)*100).toFixed(1)+'%', color: 'border-emerald-500', bg: 'bg-emerald-500/10', text: 'text-emerald-400', width: 'w-[45%]' }
                    ];
                });
        }
    }">
        <template x-for="(stage, index) in stages" :key="index">
            <div class="relative group cursor-pointer hover:scale-[1.01] transition-transform duration-300" @click="alert('Drilldown into ' + stage.name + ' available in full reporting view.')">
                <!-- Conversion Rate Connector (except first) -->
                <div x-show="index > 0" class="absolute -top-4 right-4 flex items-center justify-end text-[10px] text-slate-500">
                    <span class="bg-black/50 px-2 py-0.5 rounded-full border border-white/5"><i class="fa-solid fa-arrow-down mr-1"></i> <span x-text="stage.rate"></span></span>
                </div>
                
                <div :class="`border-l-4 ${stage.color} ${stage.bg} p-4 rounded-r-xl flex justify-between items-center transition-all group-hover:bg-white/10 ${stage.width} shadow-lg shadow-black/50`">
                    <div>
                        <h4 class="text-xs font-bold text-slate-300 uppercase tracking-widest mb-1" x-text="stage.name"></h4>
                        <p :class="`text-2xl font-black ${stage.text}`" x-text="stage.count ? stage.count.toLocaleString() : '0'"></p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-white/10 group-hover:text-white/30 transition-colors"></i>
                </div>
            </div>
        </template>
    </div>
</div>
