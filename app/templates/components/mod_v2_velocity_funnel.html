<div class="bg-black border border-dark-800 p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-sm font-bold text-white tracking-widest uppercase"><i class="fa-solid fa-filter mr-2 text-cyan-400"></i> Audience Velocity</h3>
            <p class="text-[10px] text-slate-400 mt-1">Conversion velocity across buying journey stages</p>
        </div>
        <button class="w-8 h-8 rounded bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i class="fa-solid fa-expand text-slate-400 text-xs"></i>
        </button>
    </div>

    <!-- Funnel Visualization (Vertical Stepper) -->
    <div class="flex-grow flex flex-col justify-center px-4" x-data="{
        stages: [],
        drilldownHtml: '',
        openDrilldown(stageId) {
            if (!stageId) return;
            fetch(`/dashboard/v2/funnel-drilldown?campaign_id=${document.getElementById('current_campaign').value}&stage=${stageId}`)
                .then(res => res.text())
                .then(html => {
                    this.drilldownHtml = html;
                    // Execute Alpine on the new HTML
                    setTimeout(() => {
                        if (window.Alpine) {
                            window.Alpine.initTree(document.getElementById('funnel-drilldown-container'));
                        }
                    }, 50);
                });
        },
        init() {
            fetch(`/api/v2/dashboard/ui-lab/funnel?campaign_id=${document.getElementById('current_campaign').value}`)
                .then(res => res.json())
                .then(data => {
                    const formatMoney = (val) => {
                        if (!val) return null;
                        if (val >= 1000000) return '$' + (val / 1000000).toFixed(1) + 'M';
                        if (val >= 1000) return '$' + (val / 1000).toFixed(0) + 'K';
                        return '$' + val;
                    };
                    
                    this.stages = [
                        { name: 'Total sessions', id: null, count: data.visitors, rate: null, val: null, valColor: '', dot: 'bg-slate-400 shadow-[0_0_8px_rgba(148,163,184,0.5)]', countLabel: '' },
                        { name: 'Engaged sessions', id: null, count: data.engaged, rate: ((data.engaged/Math.max(data.visitors, 1))*100).toFixed(1)+'%', val: null, valColor: '', dot: 'bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.5)]', countLabel: '' },
                        { name: 'Known users', id: 'known_users', count: data.known, rate: ((data.known/Math.max(data.engaged, 1))*100).toFixed(1)+'%', val: null, valColor: '', dot: 'bg-indigo-400 shadow-[0_0_8px_rgba(129,140,248,0.5)]', countLabel: '' },
                        { name: 'Opportunities (SQL)', id: 'opportunities', count: data.pipeline, rate: ((data.pipeline/Math.max(data.known, 1))*100).toFixed(1)+'%', val: formatMoney(data.pipeline_val), valColor: 'text-amber-400', dot: 'bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.5)]', countLabel: 'Opps' },
                        { name: 'Closed contracts', id: 'contracts', count: data.won, rate: ((data.won/Math.max(data.pipeline, 1))*100).toFixed(1)+'%', val: formatMoney(data.won_val), valColor: 'text-emerald-400', dot: 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.5)]', countLabel: 'Contracts' }
                    ];
                });
        }
    }">
        <div class="relative pl-10 py-2">
            <!-- Vertical connecting line -->
            <!-- Parent padding left is 40px. Line left is 20px. Center of line is 20.5px. -->
            <div class="absolute left-[20px] top-4 bottom-4 w-px bg-dark-700"></div>

            <template x-for="(stage, index) in stages" :key="index">
                <div class="relative mb-12 last:mb-0 transition-transform duration-300" 
                     :class="stage.id ? 'cursor-pointer hover:translate-x-1 group' : ''"
                     @click="openDrilldown(stage.id)">
                     
                    <!-- The Glowing Dot -->
                    <!-- Dot is 8px wide. Left offset of -24px relative to child's 40px padding = 16px. Center = 20px. Perfect alignment. -->
                    <div :class="`absolute -left-[24px] top-2.5 w-2 h-2 rounded-full ${stage.dot} z-10 transition-transform ${stage.id ? 'group-hover:scale-150' : ''}`"></div>

                    <!-- Conversion Pill -->
                    <!-- Centered precisely over the line -->
                    <div x-show="index > 0" class="absolute -top-7 left-[-20px] -translate-x-1/2 flex items-center z-10">
                        <span class="bg-black border border-dark-700 px-2 py-0.5 rounded text-[9px] text-slate-400 flex items-center gap-1 shadow-sm whitespace-nowrap">
                            <i class="fa-solid fa-arrow-turn-down text-slate-600"></i> <span x-text="stage.rate"></span>
                        </span>
                    </div>

                    <!-- Content -->
                    <div class="pl-2">
                        <div class="flex items-center gap-2 mb-0.5">
                            <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest" x-text="stage.name"></h4>
                            <i x-show="stage.id" class="fa-solid fa-arrow-up-right-from-square text-[9px] text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <template x-if="stage.val">
                                <div class="flex items-baseline gap-2">
                                    <p :class="`text-2xl font-black ${stage.valColor} tracking-tight`" x-text="stage.val"></p>
                                    <p class="text-sm font-bold text-slate-500" x-text="(stage.count ? stage.count.toLocaleString() : '0') + ' ' + stage.countLabel"></p>
                                </div>
                            </template>
                            <template x-if="!stage.val">
                                <p class="text-2xl font-black text-slate-200 tracking-tight" x-text="stage.count ? stage.count.toLocaleString() : '0'"></p>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Modal Container -->
        <div id="funnel-drilldown-container" x-html="drilldownHtml"></div>
    </div>
</div>
