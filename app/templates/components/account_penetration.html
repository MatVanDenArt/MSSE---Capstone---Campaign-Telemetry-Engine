<div class="w-full mt-6">
    <input type="hidden" id="current_campaign" name="campaign_id" value="{{ campaign_id }}">
    <div class="bg-black border border-brand-500/30 p-6 md:p-8 relative overflow-hidden">
        <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
            <i class="fa-solid fa-crosshairs fa-6x text-brand-500"></i>
        </div>
        
        <div class="flex justify-between items-center mb-6 border-b border-brand-500/20 pb-4 relative z-10">
            <div>
                <h3 class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest flex items-center mb-1">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Module 5: Prioritized Target Actions
                </h3>
                <p class="text-[10px] text-slate-400 uppercase tracking-wider">AI-synthesized sales pipeline recommendations scoped to the active campaign.</p>
            </div>
        </div>
        
        <div class="space-y-4 relative z-10" x-data="{ targets: [], loading: true }" x-init="fetch('/api/dashboard/sales-alerts?campaign_id=' + document.getElementById('current_campaign').value).then(r=>r.json()).then(d => { targets = d; loading = false; })">
            
            <div x-show="loading" class="flex justify-center py-8">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-500"></i>
            </div>
            
            <template x-for="(target, index) in targets" :key="index">
                <div :class="target.bg + ' ' + target.border" class="border p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:border-brand-500/50 transition-colors bg-black">
                    <div class="flex items-start gap-4 w-full sm:w-auto">
                        <div class="w-12 h-12 flex flex-col items-center justify-center shrink-0 border bg-black" :class="target.border + ' ' + target.color">
                            <span class="font-black text-lg leading-none" x-text="target.interactions"></span>
                            <span class="text-[9px] uppercase tracking-tighter opacity-80">Touches</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold text-slate-100 text-sm" x-text="target.name"></span>
                                <span class="text-[10px] px-2 py-0.5 text-dark-900 font-bold uppercase tracking-widest border" :class="target.status === 'SQL' ? 'bg-emerald-500 border-emerald-400' : (target.status === 'MQL' ? 'bg-brand-500 border-brand-400' : 'bg-slate-500 border-slate-400')" x-text="target.status"></span>
                            </div>
                            <div class="text-[10px] font-mono text-slate-400 mt-1 flex items-center gap-2 flex-wrap uppercase tracking-widest">
                                <span x-text="target.seniority"></span> at <span class="font-bold text-slate-300" x-text="target.company"></span>
                                <span class="text-dark-600">|</span>
                                <span class="text-[10px] text-slate-500"><i class="fa-solid fa-users mr-1"></i> <span x-text="target.personas"></span> active personas</span>
                            </div>
                            <div class="mt-3 p-3 bg-black border border-dark-800 text-[10px] font-mono text-slate-400 flex items-start gap-2">
                                <i class="fa-solid fa-robot text-brand-400 mt-0.5"></i>
                                <span x-text="target.action"></span>
                            </div>
                        </div>
                    </div>
                    <button class="shrink-0 bg-black hover:bg-brand-900 text-brand-400 hover:text-brand-300 border border-brand-500/50 hover:border-brand-500 text-[10px] font-bold uppercase tracking-widest py-2 px-4 transition-colors flex items-center gap-2 w-full sm:w-auto justify-center">
                        <i class="fa-solid fa-bolt"></i> Execute
                    </button>
                </div>
            </template>
            
            <div x-show="!loading && targets.length === 0" class="text-center py-8 text-[10px] uppercase tracking-widest text-slate-500 font-mono">
                No qualified targets detected for this campaign yet.
            </div>
        </div>
    </div>
</div>
