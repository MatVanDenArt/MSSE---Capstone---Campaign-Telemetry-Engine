<div class="max-w-6xl mx-auto mt-6">
    <input type="hidden" id="current_campaign" name="campaign_id" value="{{ campaign_id }}">
    <div class="glass-panel rounded-xl p-6 md:p-8 relative overflow-hidden border border-brand-500/20">
        <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
            <i class="fa-solid fa-crosshairs fa-6x text-brand-500"></i>
        </div>
        
        <div class="flex justify-between items-center mb-6 border-b border-dark-700 pb-4 relative z-10">
            <div>
                <h3 class="text-sm font-bold text-emerald-400 uppercase tracking-wider flex items-center mb-1">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Module 5: Prioritized Target Actions
                </h3>
                <p class="text-xs text-slate-400">AI-synthesized sales pipeline recommendations scoped to the active campaign.</p>
            </div>
        </div>
        
        <div class="space-y-4 relative z-10" x-data="{ targets: [], loading: true }" x-init="fetch('/api/dashboard/sales-alerts?campaign_id=' + document.getElementById('current_campaign').value).then(r=>r.json()).then(d => { targets = d; loading = false; })">
            
            <div x-show="loading" class="flex justify-center py-8">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-500"></i>
            </div>
            
            <template x-for="(target, index) in targets" :key="index">
                <div :class="target.bg + ' ' + target.border" class="border rounded-lg p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:brightness-110 transition-all">
                    <div class="flex items-start gap-4 w-full sm:w-auto">
                        <div class="w-12 h-12 rounded-full flex flex-col items-center justify-center shrink-0 border" :class="target.bg + ' ' + target.border + ' ' + target.color">
                            <span class="font-black text-lg leading-none" x-text="target.interactions"></span>
                            <span class="text-[9px] uppercase tracking-tighter opacity-80">Touches</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold text-slate-100" x-text="target.name"></span>
                                <span class="text-xs px-2 py-0.5 rounded text-dark-900 font-bold" :class="target.status === 'SQL' ? 'bg-emerald-400' : (target.status === 'MQL' ? 'bg-brand-400' : 'bg-slate-400')" x-text="target.status"></span>
                            </div>
                            <div class="text-sm text-slate-300 mt-1 flex items-center gap-2 flex-wrap">
                                <span x-text="target.seniority"></span> at <span class="font-bold" x-text="target.company"></span>
                                <span class="text-dark-500">|</span>
                                <span class="text-xs text-slate-400"><i class="fa-solid fa-users mr-1"></i> <span x-text="target.personas"></span> active personas</span>
                            </div>
                            <div class="mt-3 p-3 bg-dark-900/50 rounded text-sm text-slate-300 border border-dark-700/50 flex items-start gap-2">
                                <i class="fa-solid fa-robot text-brand-400 mt-0.5"></i>
                                <span x-text="target.action"></span>
                            </div>
                        </div>
                    </div>
                    <button class="shrink-0 bg-transparent hover:bg-brand-500 text-brand-400 hover:text-white border border-brand-500/50 hover:border-brand-500 text-xs font-bold py-2 px-4 rounded transition-all flex items-center gap-2 w-full sm:w-auto justify-center">
                        <i class="fa-solid fa-bolt"></i> Execute
                    </button>
                </div>
            </template>
            
            <div x-show="!loading && targets.length === 0" class="text-center py-8 text-slate-500">
                No qualified targets detected for this campaign yet.
            </div>
        </div>
    </div>
</div>
