<div class="col-span-12 lg:col-span-3 bg-black border border-dark-800 p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-sm font-bold text-white tracking-widest uppercase"><i
                    class="fa-solid fa-bullseye mr-2 text-cyan-400"></i> Pipeline Efficiency</h3>
            <p class="text-xs text-slate-400 mt-1">Cost Per Opportunity (CPO)</p>
        </div>
        <button class="w-8 h-8 rounded bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i class="fa-solid fa-expand text-slate-400 text-xs"></i>
        </button>
    </div>

    <div class="flex-grow flex flex-col justify-center pl-4" x-data="{
        metrics: [],
        initEfficiency() {
            const campaignId = document.getElementById('current_campaign').value;
            fetch(`/api/v2/dashboard/v2/channel-roi-data?campaign_id=${campaignId}&timeframe={{ timeframe }}`)
                .then(res => res.json())
                .then(data => {
                    this.metrics = [
                        { name: 'LinkedIn Ads', cpo: data.linkedin ? data.linkedin.cpo : 0, dot: 'bg-blue-400 shadow-[0_0_8px_rgba(96,165,250,0.5)]' },
                        { name: 'Email Campaigns', cpo: data.email ? data.email.cpo : 0, dot: 'bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,0.5)]' },
                        { name: 'Web Traffic', cpo: data.web ? data.web.cpo : 0, dot: 'bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.5)]' }
                    ].sort((a, b) => a.cpo - b.cpo);
                });
        },
        formatCurrency(val) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
        }
    }" x-init="initEfficiency()">

        <div class="relative py-2">
            <template x-for="(item, index) in metrics" :key="item.name">
                <div class="relative mb-8 last:mb-0 pl-4">
                    <!-- The Glowing Dot -->
                    <div :class="`absolute left-[-4px] top-2.5 w-2 h-2 rounded-full ${item.dot} z-10`"></div>

                    <!-- Content -->
                    <div>
                        <div class="flex items-center gap-2 mb-0.5">
                            <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
                                x-text="item.name"></h4>
                            <span class="text-[9px] text-slate-600 border border-dark-700 px-1.5 rounded-sm">#<span
                                    x-text="index + 1"></span></span>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <p class="text-2xl font-black text-slate-200 tracking-tight"
                                x-text="formatCurrency(item.cpo)"></p>
                        </div>
                    </div>
                </div>
            </template>
        </div>

    </div>
</div>
