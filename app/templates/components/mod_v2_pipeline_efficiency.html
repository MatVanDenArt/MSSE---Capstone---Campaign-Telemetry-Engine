<div class="col-span-12 lg:col-span-3 bg-black border border-dark-800 p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-sm font-bold text-white tracking-widest uppercase"><i class="fa-solid fa-bullseye mr-2 text-cyan-400"></i> Pipeline Efficiency</h3>
            <p class="text-[10px] text-slate-400 mt-1">Cost Per Opportunity (CPO)</p>
        </div>
        <button class="w-8 h-8 rounded bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i class="fa-solid fa-expand text-slate-400 text-xs"></i>
        </button>
    </div>

    <div class="flex-grow flex flex-col justify-center space-y-4" x-data="{
        metrics: [],
        initEfficiency() {
            const campaignId = document.getElementById('current_campaign').value;
            fetch(`/api/v2/dashboard/v2/channel-roi-data?campaign_id=${campaignId}`)
                .then(res => res.json())
                .then(data => {
                    this.metrics = [
                        { name: 'LinkedIn Ads', cpo: data.linkedin ? data.linkedin.cpo : 0, icon: 'fa-brands fa-linkedin text-blue-500' },
                        { name: 'Email Campaigns', cpo: data.email ? data.email.cpo : 0, icon: 'fa-solid fa-envelope text-violet-500' },
                        { name: 'Web Traffic', cpo: data.web ? data.web.cpo : 0, icon: 'fa-solid fa-globe text-cyan-500' }
                    ].sort((a, b) => a.cpo - b.cpo);
                });
        },
        formatCurrency(val) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
        }
    }" x-init="initEfficiency()">
        
        <template x-for="(item, index) in metrics" :key="item.name">
            <div class="flex items-center justify-between p-3 rounded bg-dark-900/50 border border-dark-800">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-dark-800 flex items-center justify-center">
                        <i :class="item.icon"></i>
                    </div>
                    <div>
                        <div class="text-xs font-bold text-slate-300 uppercase tracking-wide" x-text="item.name"></div>
                        <div class="text-[10px] text-slate-500">Rank #<span x-text="index + 1"></span></div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-lg font-black text-white" x-text="formatCurrency(item.cpo)"></div>
                </div>
            </div>
        </template>
        
    </div>
</div>
