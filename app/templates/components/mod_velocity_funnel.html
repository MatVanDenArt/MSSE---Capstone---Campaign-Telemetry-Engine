<div class="col-span-12 xl:col-span-9 bg-black border border-dark-800 p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-sm font-bold text-white tracking-widest uppercase"><i
                    class="fa-solid fa-filter mr-2 text-cyan-400"></i> Audience Velocity</h3>
            <p class="text-xs text-slate-400 mt-1">Conversion velocity across buying journey stages</p>
        </div>
        <button class="w-8 h-8 rounded bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i class="fa-solid fa-expand text-slate-400 text-xs"></i>
        </button>
    </div>

    <!-- Funnel Visualization -->
    <div class="flex-grow flex flex-col justify-center" x-data="{
        stages: [],
        drilldownHtml: '',
        isLoading: null,
        openDrilldown(stageId) {
            if (!stageId) return;
            this.isLoading = stageId;
            this.drilldownHtml = ''; // Clear to force Alpine x-data re-initialization
            setTimeout(() => {
                fetch(`/api/dashboard/funnel-drilldown?campaign_id=${document.getElementById('current_campaign').value}&stage=${stageId}&timeframe={{ timeframe }}`)
                    .then(res => res.text())
                    .then(html => {
                        this.drilldownHtml = html;
                        this.isLoading = null;
                        // Execute Alpine on the new HTML
                        setTimeout(() => {
                            if (window.Alpine) {
                                window.Alpine.initTree(document.getElementById('funnel-drilldown-container'));
                            }
                        }, 50);
                    });
            }, 10);
        },
        init() {
            fetch(`/api/dashboard/ui-lab/funnel?campaign_id=${document.getElementById('current_campaign').value}&timeframe={{ timeframe }}`)
                .then(res => res.json())
                .then(data => {
                    const formatMoney = (val) => {
                        if (!val) return null;
                        if (val >= 1000000) return '$' + (val / 1000000).toFixed(1) + 'M';
                        if (val >= 1000) return '$' + (val / 1000).toFixed(0) + 'K';
                        return '$' + val;
                    };
                    
                    this.stages = [
                        { name: 'Total sessions', id: null, count: data.visitors, rate: null, val: null, valColor: '', dot: 'bg-slate-400 shadow-[0_0_8px_rgba(148,163,184,0.5)]', countLabel: '' },
                        { name: 'Engaged sessions', id: null, count: data.engaged, rate: ((data.engaged/Math.max(data.visitors, 1))*100).toFixed(1)+'%', val: null, valColor: '', dot: 'bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.5)]', countLabel: '' },
                        { name: 'Known users', id: 'known_users', count: data.known, rate: ((data.known/Math.max(data.engaged, 1))*100).toFixed(1)+'%', val: null, valColor: '', dot: 'bg-indigo-400 shadow-[0_0_8px_rgba(129,140,248,0.5)]', countLabel: '' },
                        { name: 'Opportunities (SQL)', id: 'opportunities', count: data.pipeline, rate: ((data.pipeline/Math.max(data.known, 1))*100).toFixed(1)+'%', val: formatMoney(data.pipeline_val), valColor: 'text-amber-400', dot: 'bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.5)]', countLabel: 'Opps' },
                        { name: 'Closed contracts', id: 'contracts', count: data.won, rate: ((data.won/Math.max(data.pipeline, 1))*100).toFixed(1)+'%', val: formatMoney(data.won_val), valColor: 'text-emerald-400', dot: 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.5)]', countLabel: 'Contracts' }
                    ];
                });
        }
    }">
        <div class="relative py-8 xl:py-12 flex flex-col xl:flex-row xl:items-center xl:justify-between px-8 xl:px-4">
            
            <!-- Connecting line (vertical on mobile, horizontal on xl) -->
            <div class="absolute left-[36px] xl:left-12 top-12 bottom-12 w-px xl:w-auto xl:h-px xl:top-[4.5rem] xl:left-8 xl:right-8 bg-dark-700"></div>

            <template x-for="(stage, index) in stages" :key="index">
                <div class="relative flex-1 mb-12 xl:mb-0 last:mb-0 transition-transform duration-300 flex flex-col xl:items-center"
                    :class="stage.id ? 'cursor-pointer hover:-translate-y-1 group' : ''"
                    @click="openDrilldown(stage.id)">

                    <!-- The Glowing Dot -->
                    <div
                        :class="`absolute -left-1 xl:left-1/2 xl:-translate-x-1/2 top-1.5 xl:-top-2.5 w-2.5 h-2.5 rounded-full ${stage.dot} z-10 transition-transform ${stage.id ? 'group-hover:scale-150' : ''}`">
                    </div>

                    <!-- Conversion Pill -->
                    <div x-show="index > 0"
                        class="absolute -top-7 xl:-top-8 left-[-4px] xl:left-0 xl:-translate-x-1/2 flex items-center z-10 xl:-ml-[50%]">
                        <span
                            class="bg-black border border-dark-700 px-2 py-0.5 rounded text-[9px] text-slate-400 flex items-center shadow-sm whitespace-nowrap"
                            x-text="stage.rate">
                        </span>
                    </div>

                    <!-- Content -->
                    <div class="pl-6 xl:pl-0 xl:text-center xl:mt-8">
                        <div class="flex items-center xl:justify-center gap-2 mb-1">
                            <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
                                x-text="stage.name"></h4>
                            <i x-show="stage.id && isLoading !== stage.id"
                                class="fa-solid fa-arrow-up-right-from-square text-[9px] text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                            <i x-show="stage.id && isLoading === stage.id"
                                class="fa-solid fa-circle-notch fa-spin text-[9px] text-brand-500"></i>
                        </div>
                        <div class="flex items-baseline xl:justify-center gap-2">
                            <template x-if="stage.val">
                                <div class="flex items-baseline gap-2">
                                    <p :class="`text-xl lg:text-2xl font-black ${stage.valColor} tracking-tight`"
                                        x-text="stage.val"></p>
                                    <p class="text-xs lg:text-sm font-bold text-slate-500"
                                        x-text="(stage.count ? stage.count.toLocaleString() : '0') + ' ' + stage.countLabel">
                                    </p>
                                </div>
                            </template>
                            <template x-if="!stage.val">
                                <p class="text-xl lg:text-2xl font-black text-slate-200 tracking-tight"
                                    x-text="stage.count ? stage.count.toLocaleString() : '0'"></p>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Modal Container -->
        <div id="funnel-drilldown-container" x-html="drilldownHtml"></div>
    </div>
</div>
