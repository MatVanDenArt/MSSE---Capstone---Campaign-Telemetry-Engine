<!-- User Timeline Modal -->
<div x-data="{
    showUserModal: false,
    selectedUser: null,
    
    initUserModal() {
        window.addEventListener('open-user-modal', (e) => {
            this.selectedUser = e.detail.user;
            this.showUserModal = true;
        });
    }
}" x-init="initUserModal()" x-cloak>
    <template x-teleport="body">
        <div>
            <!-- Modal Slide-over Backdrop -->
            <div x-show="showUserModal" class="fixed inset-0 bg-black/60 z-40 backdrop-blur-sm" @click="showUserModal = false" style="display: none;" x-transition.opacity></div>
            
            <!-- Modal Slide-over for User Timeline -->
            <div x-show="showUserModal" class="fixed inset-y-0 right-0 w-[500px] bg-dark-800 border-l border-dark-600 shadow-[0_0_50px_rgba(0,0,0,0.8)] flex flex-col transform transition-transform z-50"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-x-full"
                 x-transition:enter-end="translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="translate-x-0"
                 x-transition:leave-end="translate-x-full" style="display: none;">
                 
                <!-- Modal Header -->
                <div class="flex justify-between items-center p-6 border-b border-dark-700 bg-dark-900/50">
                    <div>
                        <h4 class="text-xl font-bold text-white" x-text="selectedUser?.name"></h4>
                        <div class="text-sm text-sky-400 font-medium mt-1" x-text="selectedUser?.company + ' &bull; ' + selectedUser?.title"></div>
                    </div>
                    <button @click="showUserModal = false" class="text-slate-400 hover:text-white transition-colors bg-dark-700 hover:bg-dark-600 w-8 h-8 rounded-full flex items-center justify-center border border-dark-600">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <template x-if="selectedUser">
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-3">
                            <div class="bg-dark-900 border border-dark-700 rounded-lg p-4 shadow-sm">
                                <div class="flex justify-between items-center mb-4 pb-4 border-b border-dark-700">
                                    <div class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Engagement Journey</div>
                                    <div class="bg-dark-800 border border-dark-600 px-3 py-1.5 rounded text-xs text-slate-300 font-bold flex items-center gap-2 shadow-inner">
                                        <i class="fa-solid fa-bullseye text-sky-500"></i> <span x-text="selectedUser.interactions + ' interactions'"></span>
                                    </div>
                                </div>
                                
                                <ul class="relative border-l border-dark-600 ml-2 space-y-4 pt-1 pb-2">
                                    <template x-for="(asset, index) in selectedUser.timeline" :key="index">
                                        <li class="relative pl-5">
                                            <!-- Node dot -->
                                            <div class="absolute -left-[6.5px] top-1 w-3 h-3 rounded-full border-2 border-dark-900 z-10 transition-colors bg-dark-600"></div>
                                            
                                            <div class="flex flex-col">
                                                <!-- Date -->
                                                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5" x-text="asset.date"></span>
                                                
                                                <!-- Asset name -->
                                                <div class="flex items-center text-sm font-medium w-full rounded pr-2 py-0.5 text-slate-300" :title="asset.asset">
                                                     <i class="mr-2 text-xs opacity-70" :class="{
                                                         'fa-solid fa-globe text-cyan-500': asset.type === 'Web',
                                                         'fa-solid fa-envelope text-violet-500': asset.type === 'Email',
                                                         'fa-brands fa-linkedin text-blue-500': asset.type === 'LinkedIn'
                                                     }"></i>
                                                     <span class="truncate" x-text="asset.asset"></span>
                                                </div>
                                            </div>
                                        </li>
                                    </template>
                                    <li x-show="!selectedUser.timeline || selectedUser.timeline.length === 0" class="text-sm text-slate-500 italic pl-5">
                                        No specific assets recorded.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
