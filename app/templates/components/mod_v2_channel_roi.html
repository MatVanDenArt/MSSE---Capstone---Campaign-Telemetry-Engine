<div class="col-span-12 lg:col-span-5 bg-black border border-dark-800 p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-sm font-bold text-white tracking-widest uppercase"><i
                    class="fa-solid fa-chart-bar mr-2 text-emerald-400"></i> Channel ROI Multiplier</h3>
            <p class="text-xs text-slate-400 mt-1">Pipeline Generated per $1 of Channel Spend</p>
        </div>
        <button class="w-8 h-8 rounded bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i class="fa-solid fa-expand text-slate-400 text-xs"></i>
        </button>
    </div>

    <div class="flex-grow flex flex-col justify-center" x-data="{
        metrics: [],
        initChart() {
            const campaignId = document.getElementById('current_campaign').value;
            fetch(`/api/v2/dashboard/v2/channel-roi-data?campaign_id=${campaignId}`)
                .then(res => res.json())
                .then(data => {
                    let rawMetrics = [
                        { 
                            name: 'LinkedIn Ads', 
                            roi: data.linkedin ? data.linkedin.roi_multiplier : 0, 
                            dot: 'bg-blue-400 shadow-[0_0_8px_rgba(96,165,250,0.5)]',
                            barColor: 'bg-blue-500'
                        },
                        { 
                            name: 'Email Campaigns', 
                            roi: data.email ? data.email.roi_multiplier : 0, 
                            dot: 'bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,0.5)]',
                            barColor: 'bg-violet-500'
                        },
                        { 
                            name: 'Web Traffic', 
                            roi: data.web ? data.web.roi_multiplier : 0, 
                            dot: 'bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.5)]',
                            barColor: 'bg-cyan-500'
                        }
                    ].sort((a, b) => b.roi - a.roi);
                    
                    // Use a logarithmic scale for bar width so extreme outliers don't break the visualization
                    const maxLog = Math.max(...rawMetrics.map(m => Math.log10(Math.max(m.roi, 1))));
                    
                    this.metrics = rawMetrics.map(m => {
                        m.targetPercentage = maxLog > 0 ? (Math.log10(Math.max(m.roi, 1)) / maxLog) * 100 : 0;
                        m.targetPercentage = Math.max(m.targetPercentage, 2);
                        m.percentage = 0;
                        return m;
                    });

                    setTimeout(() => {
                        this.metrics.forEach(m => m.percentage = m.targetPercentage);
                    }, 100);
                });
        },
        formatNumber(val) {
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(val);
        }
    }" x-init="initChart()">

        <div class="relative py-2">
            <template x-for="(item, index) in metrics" :key="item.name">
                <div class="mb-8 last:mb-0">
                    <div class="flex justify-between items-end mb-2">
                        <div class="flex items-center gap-2">
                            <div :class="`w-1.5 h-1.5 rounded-full ${item.dot}`"></div>
                            <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
                                x-text="item.name"></h4>
                        </div>
                        <div class="flex items-baseline gap-0.5">
                            <span class="text-xl font-black text-slate-200 tracking-tight"
                                x-text="formatNumber(item.roi)"></span>
                            <span class="text-[10px] font-bold text-slate-500 ml-0.5">x</span>
                        </div>
                    </div>
                    <!-- Bar -->
                    <div class="h-1 w-full bg-dark-800 rounded-full overflow-hidden">
                        <div :class="`h-full ${item.barColor} rounded-full transition-all duration-1000 ease-out`"
                            :style="`width: ${item.percentage}%`"></div>
                    </div>
                </div>
            </template>
        </div>

    </div>
</div>
