<div class="bg-black border border-dark-800 p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-sm font-bold text-white tracking-widest uppercase"><i class="fa-solid fa-chart-area mr-2 text-emerald-400"></i> Omnichannel ROI Impact</h3>
            <p class="text-[10px] text-slate-400 mt-1">Cross-channel engagement vs Cost Per Acquisition trend</p>
        </div>
        <button class="w-8 h-8 rounded bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i class="fa-solid fa-expand text-slate-400 text-xs"></i>
        </button>
    </div>

    <!-- The actual chart wrapper -->
    <div class="flex-grow w-full relative min-h-[250px]" x-data="{
        initChart() {
            const campaignId = document.getElementById('current_campaign').value;
            fetch(`/api/v2/dashboard/ui-lab/channel-roi-data?campaign_id=${campaignId}`)
                .then(res => res.json())
                .then(data => {
                    const ctx = this.$refs.roiCanvas.getContext('2d');
                    
                    // Create Gradients
                    const emeraldGradient = ctx.createLinearGradient(0, 0, 0, 300);
                    emeraldGradient.addColorStop(0, 'rgba(16, 185, 129, 0.4)');
                    emeraldGradient.addColorStop(1, 'rgba(16, 185, 129, 0)');
                    
                    const cyanGradient = ctx.createLinearGradient(0, 0, 0, 300);
                    cyanGradient.addColorStop(0, 'rgba(6, 182, 212, 0.3)');
                    cyanGradient.addColorStop(1, 'rgba(6, 182, 212, 0)');

                    const labels = ['LinkedIn Ads', 'Email Campaigns', 'Web Traffic'];
                    const spendData = [
                        data.linkedin ? data.linkedin.total_spend : 0, 
                        data.email ? data.email.total_clicks : 0, 
                        data.web ? data.web.total_pageviews : 0
                    ];
                    const roiData = [
                        data.linkedin ? data.linkedin.accounts_reached : 0,
                        data.email ? data.email.accounts_engaged : 0,
                        data.web ? data.web.accounts_identified : 0
                    ];

                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    type: 'line',
                                    label: 'Accounts Engaged',
                                    data: roiData,
                                    borderColor: '#10b981', // emerald-500
                                    backgroundColor: emeraldGradient,
                                    borderWidth: 2,
                                    tension: 0.4,
                                    fill: true,
                                    yAxisID: 'y1'
                                },
                                {
                                    type: 'bar',
                                    label: 'Engagement Volume (Spend/Clicks/Views)',
                                    data: spendData,
                                    borderColor: '#06b6d4', // cyan-500
                                    backgroundColor: 'rgba(6, 182, 212, 0.2)',
                                    borderWidth: 1,
                                    borderRadius: 4,
                                    yAxisID: 'y'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: {
                                    display: true,
                                    labels: { color: '#94a3b8', boxWidth: 12, usePointStyle: true }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                    titleColor: '#fff',
                                    bodyColor: '#cbd5e1',
                                    borderColor: 'rgba(255,255,255,0.1)',
                                    borderWidth: 1,
                                    padding: 10
                                }
                            },
                            scales: {
                                x: {
                                    grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                                    ticks: { color: '#64748b' }
                                },
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                                    ticks: { color: '#64748b' }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    grid: { drawOnChartArea: false },
                                    ticks: { color: '#10b981' }
                                }
                            }
                        }
                    });
                });
        }
    }" x-init="initChart()">
        <canvas x-ref="roiCanvas"></canvas>
    </div>
</div>
