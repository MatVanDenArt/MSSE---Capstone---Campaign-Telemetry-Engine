<div class="col-span-12 lg:col-span-5 bg-black border border-dark-800 p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-sm font-bold text-white tracking-widest uppercase"><i class="fa-solid fa-chart-bar mr-2 text-emerald-400"></i> Channel ROI Multiplier</h3>
            <p class="text-[10px] text-slate-400 mt-1">Pipeline Generated per $1 of Channel Spend</p>
        </div>
        <button class="w-8 h-8 rounded bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
            <i class="fa-solid fa-expand text-slate-400 text-xs"></i>
        </button>
    </div>

    <!-- The actual chart wrapper -->
    <div class="flex-grow w-full relative min-h-[250px] flex items-center justify-center" x-data="{
        initChart() {
            const campaignId = document.getElementById('current_campaign').value;
            fetch(`/api/v2/dashboard/v2/channel-roi-data?campaign_id=${campaignId}`)
                .then(res => res.json())
                .then(data => {
                    const ctx = this.$refs.roiCanvas.getContext('2d');
                    
                    const labels = ['LinkedIn Ads', 'Email Campaigns', 'Web Traffic'];
                    const roiData = [
                        data.linkedin ? data.linkedin.roi_multiplier : 0,
                        data.email ? data.email.roi_multiplier : 0,
                        data.web ? data.web.roi_multiplier : 0
                    ];

                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'ROI Multiplier',
                                data: roiData,
                                backgroundColor: 'rgba(16, 185, 129, 0.8)',
                                hoverBackgroundColor: 'rgba(52, 211, 153, 1)',
                                borderRadius: 4,
                                barThickness: 24
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    titleColor: '#94a3b8',
                                    bodyColor: '#fff',
                                    borderColor: '#334155',
                                    borderWidth: 1,
                                    padding: 12,
                                    displayColors: false,
                                    callbacks: {
                                        label: function(context) {
                                            return context.parsed.x + 'x ROI';
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    grid: { color: '#1e293b', drawBorder: false },
                                    ticks: {
                                        color: '#64748b',
                                        font: { size: 10, family: 'Inter' },
                                        callback: function(value) {
                                            return value + 'x';
                                        }
                                    },
                                    border: { display: false }
                                },
                                y: {
                                    grid: { display: false, drawBorder: false },
                                    ticks: {
                                        color: '#94a3b8',
                                        font: { size: 11, family: 'Inter', weight: 'bold' }
                                    },
                                    border: { display: false }
                                }
                            }
                        }
                    });
                });
        }
    }" x-init="initChart()">
        <canvas x-ref="roiCanvas"></canvas>
    </div>
</div>
