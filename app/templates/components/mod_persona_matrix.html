<div class="mt-0" x-data="{ 
    loading: true, 
    activeTab: 'matrix',
    matrix: {}, 
    companies: [],
    users: [],
    sqls: [],
    mqls: [],
    coldLeads: [],
    selectedCellUsers: [],
    modalOpen: false,
    modalTitle: '',
    modalSubtitle: '',
    modalAiInsight: '',
    init() {
        const campaignId = '{{ campaign_id }}';
        fetch(`/api/dashboard/audience-data-scoped${campaignId ? '?campaign_id='+campaignId : ''}`)
            .then(res => res.json())
            .then(data => {
                const fetchedUsers = data.users || [];
                this.users = fetchedUsers;
                const m = {};
                
                const s = [];
                const mq = [];
                const c = [];

                fetchedUsers.forEach(u => {
                    // Matrix Logic
                    if(!m[u.company]) {
                        m[u.company] = {'C-Suite': [], 'VP/Director': [], 'Manager': [], 'IC': []};
                    }
                    let sen = u.seniority;
                    if(sen === 'VP / Director') sen = 'VP/Director';
                    if(sen === 'Individual Contributor') sen = 'IC';
                    
                    if(m[u.company][sen]) {
                        m[u.company][sen].push(u);
                    }
                    
                    // Pipeline Logic
                    if (u.interactions > 5) s.push(u);
                    else if (u.interactions > 2) mq.push(u);
                    else c.push(u);
                });
                this.matrix = m;
                this.sqls = s.sort((a,b) => b.interactions - a.interactions);
                this.mqls = mq.sort((a,b) => b.interactions - a.interactions);
                this.coldLeads = c.sort((a,b) => b.interactions - a.interactions);
                
                // Sort companies by total engagement roughly (number of people)
                this.companies = Object.keys(m).sort((a,b) => {
                    const countA = m[a]['C-Suite'].length + m[a]['VP/Director'].length + m[a]['Manager'].length + m[a]['IC'].length;
                    const countB = m[b]['C-Suite'].length + m[b]['VP/Director'].length + m[b]['Manager'].length + m[b]['IC'].length;
                    return countB - countA;
                });
                this.loading = false;
            })
            .catch(err => {
                console.error(err);
                this.loading = false;
            });
    },
    openModal(usersArray, title, subtitle) {
        if(!usersArray || usersArray.length === 0) return;
        this.selectedCellUsers = usersArray;
        this.modalTitle = title || 'Target Personas';
        this.modalSubtitle = subtitle || (usersArray[0]?.company + ' • ' + usersArray[0]?.seniority);
        
        // Pillar 2 & 3: Context-Aware AI Insight
        const sqCount = usersArray.filter(u => u.interactions > 5).length;
        const cSuiteCount = usersArray.filter(u => u.seniority === 'C-Suite').length;
        
        if (usersArray.length === 1) {
            const u = usersArray[0];
            if (u.interactions > 5) this.modalAiInsight = `${u.name} is a highly engaged SQL. Excellent candidate for direct sales outreach.`;
            else if (u.interactions > 2) this.modalAiInsight = `${u.name} is showing consistent interest. Transition to high-value nurture track.`;
            else this.modalAiInsight = `${u.name} has low engagement. Keep in standard awareness drip.`;
        } else {
            if (sqCount > 0) {
                this.modalAiInsight = `You have ${sqCount} highly engaged SQLs in this segment showing strong purchase intent. Ready for sales handoff.`;
            } else if (cSuiteCount > 0) {
                this.modalAiInsight = `Executive engagement detected, but requires further nurturing to qualify as SQLs. Deploy executive summary assets.`;
            } else {
                this.modalAiInsight = `Standard engagement activity. Consider targeted outreach to increase interaction depth and find champions.`;
            }
        }
        
        this.modalOpen = true;
    }
}">
    <!-- Header & Tabs -->
    <div class="flex justify-end mb-3">
        
        <div class="flex items-center bg-black p-1 border border-dark-800">
            <button @click="activeTab = 'matrix'" :class="activeTab === 'matrix' ? 'bg-brand-900 border border-brand-500/50 text-brand-400' : 'text-slate-500 hover:text-slate-300 border border-transparent'" class="px-4 py-1.5 text-[10px] font-bold uppercase tracking-widest transition-colors">Target Accounts</button>
            <button @click="activeTab = 'pipeline'" :class="activeTab === 'pipeline' ? 'bg-brand-900 border border-brand-500/50 text-brand-400' : 'text-slate-500 hover:text-slate-300 border border-transparent'" class="px-4 py-1.5 text-[10px] font-bold uppercase tracking-widest transition-colors ml-1">Lead Pipeline</button>
        </div>
    </div>
    
    <div class="w-full relative bg-black border border-dark-800 overflow-hidden min-h-[500px]">
        <div x-show="loading" class="absolute inset-0 flex items-center justify-center bg-dark-900/80 z-50">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
        </div>
        
        <!-- TAB A: MATRIX -->
        <div x-show="activeTab === 'matrix'" class="overflow-x-auto max-h-[600px] custom-scrollbar" style="display: none;">
            <table class="w-full text-left text-sm text-slate-400 relative">
                <thead class="bg-dark-800 text-xs uppercase font-semibold text-slate-300 sticky top-0 z-10 shadow-md">
                    <tr>
                        <th scope="col" class="px-6 py-4">Target Account</th>
                        <th scope="col" class="px-6 py-4 text-center">C-Suite</th>
                        <th scope="col" class="px-6 py-4 text-center">VP / Director</th>
                        <th scope="col" class="px-6 py-4 text-center">Manager</th>
                        <th scope="col" class="px-6 py-4 text-center">IC</th>
                        <th scope="col" class="px-6 py-4 text-center text-blue-400">Total Targets</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="company in companies" :key="company">
                        <tr class="border-b border-dark-700/50 hover:bg-dark-800/50 transition-colors">
                            <td class="px-6 py-4 font-bold text-slate-200" x-text="company"></td>
                            
                            <!-- C-Suite -->
                            <td class="px-6 py-4 text-center">
                                <button @click="openModal(matrix[company]['C-Suite'])" 
                                        :class="matrix[company]['C-Suite'].length > 0 ? 'bg-sky-400 text-slate-900 hover:bg-sky-300 border border-sky-300' : 'text-slate-700 bg-transparent'"
                                        class="w-10 h-10 font-bold transition-colors">
                                    <span x-text="matrix[company]['C-Suite'].length || '-'"></span>
                                </button>
                            </td>
                            <!-- VP/Director -->
                            <td class="px-6 py-4 text-center">
                                <button @click="openModal(matrix[company]['VP/Director'])" 
                                        :class="matrix[company]['VP/Director'].length > 0 ? 'bg-sky-600/60 text-sky-50 hover:bg-sky-600/80 border border-sky-500' : 'text-slate-700 bg-transparent'"
                                        class="w-10 h-10 font-bold transition-colors">
                                    <span x-text="matrix[company]['VP/Director'].length || '-'"></span>
                                </button>
                            </td>
                            <!-- Manager -->
                            <td class="px-6 py-4 text-center">
                                <button @click="openModal(matrix[company]['Manager'])" 
                                        :class="matrix[company]['Manager'].length > 0 ? 'bg-sky-500/20 text-sky-300 hover:bg-sky-500/30 border border-sky-500/50' : 'text-slate-700 bg-transparent'"
                                        class="w-10 h-10 font-bold transition-colors">
                                    <span x-text="matrix[company]['Manager'].length || '-'"></span>
                                </button>
                            </td>
                            <!-- IC -->
                            <td class="px-6 py-4 text-center">
                                <button @click="openModal(matrix[company]['IC'])" 
                                        :class="matrix[company]['IC'].length > 0 ? 'bg-transparent text-sky-600 hover:bg-sky-900/20 border border-sky-900' : 'text-slate-700 bg-transparent'"
                                        class="w-10 h-10 font-bold transition-colors">
                                    <span x-text="matrix[company]['IC'].length || '-'"></span>
                                </button>
                            </td>
                            
                            <!-- Total -->
                            <td class="px-6 py-4 text-center font-bold text-slate-300 bg-dark-800/30">
                                <span x-text="matrix[company]['C-Suite'].length + matrix[company]['VP/Director'].length + matrix[company]['Manager'].length + matrix[company]['IC'].length"></span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- TAB B: PIPELINE (KANBAN) -->
        <div x-show="activeTab === 'pipeline'" class="p-6 h-[600px] overflow-y-auto custom-scrollbar bg-black" style="display: none;">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-full">
                
                <!-- Cold Leads -->
                <div class="flex flex-col bg-black border border-dark-800">
                    <div class="p-4 border-b border-dark-800 bg-dark-900 flex justify-between items-center">
                        <h4 class="font-bold text-slate-500 text-[10px] uppercase tracking-widest">Cold Leads</h4>
                        <span class="bg-dark-800 text-slate-400 text-[10px] font-bold px-2 py-0.5 border border-dark-700" x-text="coldLeads.length"></span>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto custom-scrollbar space-y-3 bg-black">
                        <template x-for="user in coldLeads" :key="user.id">
                            <div @click="openModal([user], user.name, user.company + ' • ' + user.seniority)" class="bg-black border border-dark-800 p-4 hover:border-dark-600 cursor-pointer transition-colors relative group">
                                <div class="absolute top-0 left-0 w-1 h-full bg-slate-800 opacity-50 group-hover:opacity-100 transition-opacity"></div>
                                <div class="flex justify-between items-start mb-2 pl-2">
                                    <div>
                                        <div class="font-bold text-slate-200 text-sm" x-text="user.name"></div>
                                        <div class="text-[10px] text-slate-500 font-medium uppercase tracking-widest" x-text="user.title"></div>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center mt-3 pl-2">
                                    <div class="text-[10px] font-bold uppercase tracking-widest text-slate-500" x-text="user.company"></div>
                                    <div class="text-[10px] font-bold text-slate-400 bg-dark-900 px-1.5 py-0.5 border border-dark-800">
                                        <span x-text="user.interactions"></span> ints
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- MQLs -->
                <div class="flex flex-col bg-black border border-sky-900/30">
                    <div class="p-4 border-b border-sky-900/50 bg-sky-900/10 flex justify-between items-center">
                        <h4 class="font-bold text-sky-400 text-[10px] uppercase tracking-widest">Marketing Qualified</h4>
                        <span class="bg-sky-900/30 text-sky-400 text-[10px] font-bold px-2 py-0.5 border border-sky-900/50" x-text="mqls.length"></span>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto custom-scrollbar space-y-3 bg-black">
                        <template x-for="user in mqls" :key="user.id">
                            <div @click="openModal([user], user.name, user.company + ' • ' + user.seniority)" class="bg-black border border-sky-900/30 p-4 hover:border-sky-500/50 cursor-pointer transition-colors relative group">
                                <div class="absolute top-0 left-0 w-1 h-full bg-sky-600/50 group-hover:bg-sky-500 transition-colors"></div>
                                <div class="flex justify-between items-start mb-2 pl-2">
                                    <div>
                                        <div class="font-bold text-slate-200 text-sm" x-text="user.name"></div>
                                        <div class="text-[10px] text-slate-500 font-medium uppercase tracking-widest" x-text="user.title"></div>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center mt-3 pl-2">
                                    <div class="text-[10px] font-bold uppercase tracking-widest text-slate-500" x-text="user.company"></div>
                                    <div class="text-[10px] font-bold text-sky-400 bg-sky-900/20 px-1.5 py-0.5 border border-sky-900/50">
                                        <span x-text="user.interactions"></span> ints
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- SQLs -->
                <div class="flex flex-col bg-black border border-sky-700/30">
                    <div class="p-4 border-b border-sky-700/50 bg-sky-800/10 flex justify-between items-center">
                        <h4 class="font-bold text-sky-300 text-[10px] uppercase tracking-widest">Sales Qualified</h4>
                        <span class="bg-sky-800/30 text-sky-300 text-[10px] font-bold px-2 py-0.5 border border-sky-700/50" x-text="sqls.length"></span>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto custom-scrollbar space-y-3 bg-black">
                        <template x-for="user in sqls" :key="user.id">
                            <div @click="openModal([user], user.name, user.company + ' • ' + user.seniority)" class="bg-black border border-sky-700/30 p-4 hover:border-sky-400/50 cursor-pointer transition-colors relative group">
                                <div class="absolute top-0 left-0 w-1 h-full bg-sky-500/50 group-hover:bg-sky-400 transition-colors"></div>
                                <div class="flex justify-between items-start mb-2 pl-2">
                                    <div>
                                        <div class="font-bold text-white text-sm" x-text="user.name"></div>
                                        <div class="text-[10px] text-slate-400 font-medium uppercase tracking-widest" x-text="user.title"></div>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center mt-3 pl-2">
                                    <div class="text-[10px] font-bold uppercase tracking-widest text-slate-400" x-text="user.company"></div>
                                    <div class="text-[10px] font-bold text-sky-300 bg-sky-800/20 px-1.5 py-0.5 border border-sky-700/50">
                                        <i class="fa-solid fa-fire mr-1 text-[8px]"></i><span x-text="user.interactions"></span> ints
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </div>
        
        <!-- Modal Slide-over Backdrop -->
        <div x-show="modalOpen" class="fixed inset-0 bg-black/60 z-40 backdrop-blur-sm" @click="modalOpen = false" style="display: none;" x-transition.opacity></div>
        
        <!-- Modal Slide-over for Cell/Card Drilldown -->
        <div x-show="modalOpen" class="fixed inset-y-0 right-0 w-[500px] bg-black border-l border-dark-800 flex flex-col transform transition-transform z-50"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-x-full"
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-x-0"
             x-transition:leave-end="translate-x-full" style="display: none;">
             
            <!-- Modal Header -->
            <div class="flex justify-between items-center p-6 border-b border-dark-800 bg-black">
                <div>
                    <h4 class="text-xl font-bold text-white" x-text="modalTitle"></h4>
                    <div class="text-sm text-blue-500 font-medium mt-1" x-text="modalSubtitle"></div>
                </div>
                <button @click="modalOpen = false" class="text-slate-500 hover:text-white transition-colors bg-dark-900 hover:bg-dark-800 w-8 h-8 flex items-center justify-center border border-dark-700">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Pillar 2: AI Insight & Action Panel -->
            <div class="p-6 border-b border-dark-800 bg-black">
                <div class="flex items-start gap-4">
                    <div class="w-8 h-8 bg-brand-900 border border-brand-500/50 flex items-center justify-center shrink-0 mt-0.5">
                        <i class="fa-solid fa-wand-magic-sparkles text-brand-400 text-sm"></i>
                    </div>
                    <div>
                        <h5 class="text-[10px] font-bold text-brand-500 uppercase tracking-widest mb-1">AI Context Analysis</h5>
                        <p class="text-sm text-slate-300 leading-relaxed font-mono" x-text="modalAiInsight"></p>
                        
                        <div class="mt-4 flex gap-3">
                            <button class="bg-black hover:bg-brand-900 text-[10px] font-bold uppercase tracking-widest px-4 py-2 transition-colors border border-brand-500/50 text-brand-400">
                                <i class="fa-solid fa-bolt mr-1.5"></i> Take Action
                            </button>
                            <button class="bg-black hover:bg-dark-900 text-slate-400 text-[10px] font-bold uppercase tracking-widest px-4 py-2 transition-colors border border-dark-700">
                                Sync to CRM
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- User Timelines -->
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4 bg-black">
                <div class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2">Individual Touchpoints</div>
                <template x-for="user in selectedCellUsers" :key="user.id">
                    <div class="bg-black border border-dark-800 p-5 hover:border-dark-600 transition-colors">
                        <div class="flex justify-between items-start mb-4 border-b border-dark-800 pb-3">
                            <div>
                                <div class="font-bold text-slate-200 text-base" x-text="user.name"></div>
                                <div class="text-[10px] uppercase tracking-widest text-blue-500 font-medium mt-0.5" x-text="user.title"></div>
                            </div>
                            <div class="bg-black px-2 py-1 text-[10px] uppercase tracking-widest font-bold text-slate-400 border border-dark-800 flex items-center">
                                <i class="fa-solid fa-chart-line text-slate-600 mr-1.5"></i> <span class="text-white" x-text="user.interactions"></span>
                            </div>
                        </div>
                        
                        <div>
                            <ul class="space-y-3">
                                <template x-for="asset in user.assets" :key="asset.name">
                                    <li class="flex justify-between items-center text-sm">
                                        <div class="flex items-center text-slate-300 truncate pr-4">
                                            <span class="w-6 h-6 flex items-center justify-center bg-black mr-3 text-xs border border-dark-700 shrink-0">
                                                <i class="fa-brands fa-linkedin text-blue-500" x-show="asset.type === 'LinkedIn'"></i>
                                                <i class="fa-regular fa-file-lines text-emerald-500" x-show="asset.type === 'Web'"></i>
                                                <i class="fa-regular fa-envelope text-amber-500" x-show="asset.type === 'Email'"></i>
                                            </span>
                                            <span x-text="asset.name" class="truncate font-mono text-[10px]" :title="asset.name"></span>
                                        </div>
                                        <span class="text-[10px] uppercase tracking-widest font-bold text-slate-500 bg-black px-2 py-0.5 border border-dark-800 shrink-0" x-text="asset.count + ' ints'"></span>
                                    </li>
                                </template>
                                <li x-show="!user.assets || user.assets.length === 0" class="text-[10px] uppercase tracking-widest text-slate-600">No specific assets recorded.</li>
                            </ul>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
