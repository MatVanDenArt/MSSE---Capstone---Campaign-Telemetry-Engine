<div x-data="{
    showAccountsModal: false,
    selectedAsset: null,
    selectedCellUsers: null,
    allCompanies: [],
    campaignId: document.getElementById('current_campaign').value,
    companyFilter: '',
    seniorityFilter: '',
    
    get filteredUsers() {
        if (!this.selectedCellUsers) return [];
        return this.selectedCellUsers.filter(user => {
            const matchesCompany = this.companyFilter === '' || user.company === this.companyFilter;
            const matchesSeniority = this.seniorityFilter === '' || user.seniority === this.seniorityFilter;
            return matchesCompany && matchesSeniority;
        });
    },
    
    get availableCompanies() {
        if (!this.selectedCellUsers) return [];
        const baseCompanies = this.allCompanies.length > 0 
            ? this.allCompanies 
            : Array.from(new Set(this.selectedCellUsers.map(u => u.company))).sort();
            
        return baseCompanies.map(comp => {
            const count = this.selectedCellUsers.filter(u => {
                const matchComp = u.company === comp;
                const matchSen = this.seniorityFilter === '' || u.seniority === this.seniorityFilter;
                return matchComp && matchSen;
            }).length;
            return { name: comp, count: count, label: `${comp} (${count})` };
        });
    },

    get availableSeniorities() {
        if (!this.selectedCellUsers) return [];
        const seniorities = Array.from(new Set(this.selectedCellUsers.map(u => u.seniority))).sort();
        return seniorities.map(sen => {
            const count = this.selectedCellUsers.filter(u => {
                const matchSen = u.seniority === sen;
                const matchComp = this.companyFilter === '' || u.company === this.companyFilter;
                return matchSen && matchComp;
            }).length;
            return { name: sen, count: count, label: `${sen} (${count})` };
        });
    },
    
    initModal() {
        window.addEventListener('open-asset-modal', (e) => {
            const assetName = e.detail.asset_name;
            const assetType = e.detail.type;
            const tf = e.detail.timeframe || 0;
            
            this.selectedAsset = e.detail; // Capture full object (including attribution)
            this.selectedCellUsers = null;
            this.companyFilter = '';
            this.seniorityFilter = '';
            this.showAccountsModal = true;
            
            fetch((window.location.pathname.includes('/v2/') ? '/api/v2' : '/api/v1') + `/asset-personas?campaign_id=${encodeURIComponent(this.campaignId)}&asset_name=${encodeURIComponent(assetName)}&type=${encodeURIComponent(assetType)}&timeframe=${encodeURIComponent(tf)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.users) {
                        this.selectedCellUsers = data.users;
                        this.allCompanies = data.all_companies || [];
                    } else {
                        // Fallback just in case
                        this.selectedCellUsers = data;
                        this.allCompanies = [];
                    }
                });
        });
    }
}" x-init="initModal()" x-cloak>
    <template x-teleport="body">
        <div>
            <!-- Modal Slide-over Backdrop -->
            <div x-show="showAccountsModal" class="fixed inset-0 bg-black/60 z-40 backdrop-blur-sm" @click="showAccountsModal = false" style="display: none;" x-transition.opacity></div>
            
            <!-- Modal Slide-over for Asset Personas -->
            <div x-show="showAccountsModal" class="fixed inset-y-0 right-0 w-[30%] min-w-[320px] max-w-[400px] bg-dark-900 border-l border-dark-800 shadow-2xl flex flex-col transform transition-transform z-50"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-x-full"
                 x-transition:enter-end="translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="translate-x-0"
                 x-transition:leave-end="translate-x-full" style="display: none;">
                 
                <!-- Modal Header -->
                <div class="p-6 border-b border-dark-800 flex justify-between items-start bg-black shrink-0">
                    <div>
                        <h3 class="text-sm font-bold text-white tracking-widest uppercase mb-1">
                            <i class="fa-solid fa-users mr-2 text-cyan-400"></i> Target Personas
                        </h3>
                        <p class="text-[10px] text-blue-400 uppercase tracking-widest" x-text="selectedAsset?.asset_name"></p>
                    </div>
                    <button @click="showAccountsModal = false" class="text-slate-500 hover:text-white transition-colors bg-white/5 hover:bg-white/10 w-8 h-8 rounded flex items-center justify-center shrink-0 ml-4">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Pipeline Attribution Overview (Sprint 3) -->
                <template x-if="selectedAsset?.pipeline_influenced">
                    <div class="px-6 py-4 border-b border-dark-700 bg-emerald-900/10" x-data="{ showOpps: false }">
                        <div class="flex justify-between gap-4">
                            <div class="flex-1">
                                <span class="text-[9px] uppercase tracking-widest text-emerald-500 font-bold mb-1 block">Pipeline Influenced</span>
                                <span class="text-xl font-black text-emerald-400" x-text="'$' + (selectedAsset.pipeline_influenced / 1000000).toFixed(2) + 'M'"></span>
                            </div>
                            <div class="flex-1">
                                <span class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1 block">Fractional Value</span>
                                <span class="text-xl font-black text-white" x-text="'$' + (selectedAsset.fractional_pipeline / 1000000).toFixed(2) + 'M'"></span>
                            </div>
                        </div>

                        <!-- Expandable Drill Down -->
                        <div class="mt-3">
                            <button @click="showOpps = !showOpps" class="w-full text-left flex justify-between items-center text-xs font-bold text-slate-300 hover:text-emerald-400 transition-colors py-1">
                                <span><i class="fa-solid fa-file-contract mr-1.5"></i> <span x-text="selectedAsset.influenced_opps?.length"></span> Opportunities</span>
                                <i class="fa-solid fa-chevron-down text-[10px] transition-transform" :class="showOpps ? 'rotate-180' : ''"></i>
                            </button>
                            
                            <div x-show="showOpps" x-collapse class="mt-2 space-y-2">
                                <template x-for="opp in selectedAsset.influenced_opps" :key="opp.company + opp.date">
                                    <div class="flex justify-between items-center bg-dark-900 border border-dark-700 rounded p-2">
                                        <div>
                                            <span class="text-[10px] font-bold text-white block truncate w-32" x-text="opp.company"></span>
                                            <span class="text-[9px] text-slate-400" x-text="opp.date"></span>
                                        </div>
                                        <span class="text-xs font-black text-emerald-400" x-text="'$' + (opp.value / 1000000).toFixed(1) + 'M'"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <template x-if="!selectedCellUsers">
                    <div class="p-10 flex justify-center items-center h-full">
                        <i class="fa-solid fa-circle-notch fa-spin text-brand-500 text-3xl"></i>
                    </div>
                </template>
                
                <template x-if="selectedCellUsers && selectedCellUsers.length === 0">
                    <div class="p-10 flex flex-col justify-center items-center h-full text-slate-500">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
                        <p>No target accounts have interacted with this asset.</p>
                    </div>
                </template>
                
                <template x-if="selectedCellUsers && selectedCellUsers.length > 0">
                    <div class="flex-1 flex flex-col overflow-hidden">
                        
                        <!-- Dynamic Filters -->
                        <div class="p-4 border-b border-dark-800 bg-black/50 grid grid-cols-2 gap-3 shrink-0">
                            <div>
                                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Company</label>
                                <select x-model="companyFilter" class="w-full bg-dark-900 border border-dark-700 rounded p-1.5 text-xs text-slate-300 focus:border-cyan-500 focus:ring-0">
                                    <option value="">All companies</option>
                                    <template x-for="comp in availableCompanies" :key="comp.name">
                                        <option :value="comp.name" x-text="comp.label"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Seniority</label>
                                <select x-model="seniorityFilter" class="w-full bg-dark-900 border border-dark-700 rounded p-1.5 text-xs text-slate-300 focus:border-cyan-500 focus:ring-0">
                                    <option value="">All seniorities</option>
                                    <template x-for="sen in availableSeniorities" :key="sen.name">
                                        <option :value="sen.name" x-text="sen.label"></option>
                                    </template>
                                </select>
                            </div>
                        </div>

                        <!-- User Timelines -->
                        <div class="p-4 overflow-y-auto custom-scrollbar flex-1 bg-black space-y-2">
                            <div class="flex justify-between items-center mb-3 px-1">
                                <div class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Accounts Engaged</div>
                                <div class="text-[10px] text-brand-400 font-bold bg-brand-900/20 px-2 py-0.5 rounded border border-brand-500/30" x-text="filteredUsers.length + ' Results'"></div>
                            </div>
                            
                            <template x-if="filteredUsers.length === 0">
                                <div class="text-center p-10 text-slate-500 text-xs">
                                    No accounts match your filters.
                                </div>
                            </template>

                            <template x-for="user in filteredUsers" :key="user.id">
                                <div x-data="{ expanded: false }" class="bg-dark-900/40 border border-dark-800 p-4 rounded hover:bg-dark-800/60 transition-colors cursor-pointer" @click="expanded = !expanded">
                                    <div class="flex justify-between items-center">
                                        <div>
                                            <h4 class="font-bold text-slate-200 text-sm" x-text="user.company"></h4>
                                            <p class="text-[11px] text-slate-500 mt-1"><span class="text-slate-300" x-text="user.name"></span> &bull; <span x-text="user.seniority"></span></p>
                                        </div>
                                        <div class="text-right">
                                            <div class="bg-black border border-dark-700 px-2 py-1 rounded flex items-center gap-1.5 shadow-inner" title="Interactions with this asset">
                                                <i class="fa-solid fa-bullseye text-[9px] text-brand-500"></i> <span class="text-[10px] text-slate-300 font-bold" x-text="user.interactions + ' interactions'"></span>
                                                <i class="fa-solid fa-chevron-down text-slate-500 text-[9px] ml-1 transition-transform duration-200" :class="expanded ? 'rotate-180' : ''"></i>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div x-show="expanded" x-collapse class="mt-4 pt-4 border-t border-dark-700">
                                        <div class="flex justify-between items-center mb-4">
                                            <div class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Engagement Journey</div>
                                            <div x-show="user.remaining_interactions > 0" class="text-[10px] text-slate-500 font-medium bg-dark-800 px-2 py-1 rounded border border-dark-600">
                                                + <span x-text="user.remaining_interactions"></span> earlier touchpoints
                                            </div>
                                        </div>
                                        
                                        <ul class="relative border-l border-dark-600 ml-2 space-y-4 pt-1 pb-2">
                                            <template x-for="(asset, index) in user.timeline" :key="index">
                                                <li class="relative pl-5">
                                                    <!-- Node dot -->
                                                    <div class="absolute -left-[6.5px] top-1 w-3 h-3 rounded-full border-2 border-dark-900 z-10 transition-colors"
                                                         :class="asset.is_current ? 'bg-brand-500 shadow-[0_0_8px_rgba(56,189,248,0.6)]' : 'bg-dark-600'">
                                                    </div>
                                                    
                                                    <div class="flex flex-col">
                                                        <!-- Date -->
                                                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5" x-text="asset.date"></span>
                                                        
                                                        <!-- Asset name inside a badge-like card for efficiency -->
                                                        <div class="flex items-center text-sm font-medium w-full rounded pr-2 py-0.5" 
                                                             :class="asset.is_current ? 'text-brand-300 bg-brand-900/10' : 'text-slate-300'"
                                                             :title="asset.asset">
                                                             <i class="mr-2 text-xs" :class="{
                                                                 'opacity-100 drop-shadow-[0_0_5px_rgba(255,255,255,0.3)]': asset.is_current,
                                                                 'opacity-70': !asset.is_current,
                                                                 'fa-solid fa-globe text-cyan-500': asset.type === 'Web',
                                                                 'fa-solid fa-envelope text-violet-500': asset.type === 'Email',
                                                                 'fa-brands fa-linkedin text-blue-500': asset.type === 'LinkedIn'
                                                             }"></i>
                                                             <span class="truncate" x-text="asset.asset"></span>
                                                        </div>
                                                    </div>
                                                </li>
                                            </template>
                                            <li x-show="!user.timeline || user.timeline.length === 0" class="text-sm text-slate-500 italic pl-5">
                                                No specific assets recorded.
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
