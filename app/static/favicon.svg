<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Minimal sleek dark titanium backdrop -->
  <rect width="32" height="32" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.2"/>
  
  <!-- Subtle inner radial glow -->
  <circle cx="16" cy="16" r="10" fill="#38bdf8" opacity="0.08"/>

  <!-- Clean telemetry pulse wavefront (Modern Enterprise Monoline) -->
  <path d="M 6 17 L 11 17 L 14 9 L 18 23 L 21 15 L 23 17 L 26 17" 
        stroke="url(#pulseGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Precision signal node dot -->
  <circle cx="21" cy="15" r="1.5" fill="#38bdf8"/>

  <defs>
    <linearGradient id="pulseGrad" x1="6" y1="16" x2="26" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>
